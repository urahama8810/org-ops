      {key:'exceptions', label:'例外の記録'}
    ];
    h += '<div class="tabs" role="tablist">'+tabs.map(function(t){
      var n = '';
      if(t.key==='log') n = ' ('+DB.data.reports.filter(function(r){return !r.needApproval;}).length+')';
      if(t.key==='approval') n = ' ('+DB.data.reports.filter(function(r){return r.needApproval;}).length+')';
      if(t.key==='incidents') n = ' ('+DB.data.incidents.length+')';
      if(t.key==='exceptions') n = ' ('+DB.data.exceptions.length+')';

    }).join('')+'</div>';

    if(repTab === 'rules')      h += renderRules();

      { key:'occurredAt', label:'発生日時', type:'datetime' },

function openImpForm(rec, empId){
  var e = byId(DB.data.employees, empId || (rec?rec.employeeId:''));
  var end = new Date(); end.setDate(end.getDate()+45);
  var val = rec || { employeeId:empId||'', managerId:e?e.manager:'', startDate:todayStr(), endDate:fmtDate(end),
                     facts:'', expected:'', measure:'', support:'', items:[], note:'' };
  openForm({
    title: rec?'改善計画の編集':'改善計画の作成', wide:true, value:val, fields:impFields(),
    intro:'期間は<b>30〜60日</b>。改善項目は<b>3つ以内</b>。毎週確認し、事実で記録します。'+
      '<br>虚偽報告・無断契約・資金流出・データ持出し等はこの制度で扱わず、規程・法的手続に基づいて処理してください。',
    onSubmit:function(v){
      var days = daysBetween(v.startDate, v.endDate);
      if(days < 25 || days > 70){
        if(!confirm('期間が'+days+'日です。社内ルールでは30〜60日を想定しています。このまま保存しますか？')) return false;
      }
      if(lines(v.items).length > 3){
        toast('改善項目は3つ以内にしてください（現在'+lines(v.items).length+'個）','bad'); return false;
      }
      if(rec){
        v.id = rec.id; v.weeklyChecks = rec.weeklyChecks; v.status = rec.status; v.result = rec.result;
        DB.data.improvementPlans[DB.data.improvementPlans.indexOf(rec)] = v;
      }else{
        v.id = uid('imp'); v.weeklyChecks = []; v.status = 'open'; v.result = '';
        DB.data.improvementPlans.push(v);
      }
      DB.save(); render(); toast('保存しました','ok');
    }
  });
}

/* 90日後の完成状態の自動判定 */
function goalStateCheck(){
  var d = DB.data, r = readinessScore();
  var comp = d.goals.filter(function(g){ return g.level==='company'; });
  var evs = d.evaluations.filter(function(e){ return e.period === d.settings.currentPeriod; });
  return [
    r.parts[0].rate >= 100,
    comp.length >= 3 && d.goals.some(function(g){ return g.level==='dept'; }) &&
      d.employees.some(function(e){ return lines(e.kpis).length > 0; }),
    d.kpiWeeks.length >= 4 && d.oneOnOnes.length >= 1,
    d.scorecards.length >= 6 && evs.length > 0 && evs.some(function(e){ return e.stage==='final'||e.stage==='explained'; }),
    d.grades.length === 5 && d.employees.length > 0 && d.employees.every(function(e){ return !!e.grade; }),
    d.scorecards.length > 0 && d.scorecards.every(function(s){ return (s.reports||'').trim(); })
  ];
}

action('dataImport', function(){
  pickFile('.json,application/json', function(text, filename){
    var parsed;
    try{ parsed = JSON.parse(text); }
    catch(e){ toast('ファイルを読み込めませんでした（JSON形式ではありません）','bad'); return; }
    if(!parsed || !parsed.meta || !Array.isArray(parsed.employees)){
      toast('このアプリのバックアップファイルではないようです','bad'); return;

    confirmDialog('バックアップから復元',

      '現在のデータはすべて上書きされます。よろしいですか？',
      function(){
        DB.data = mergeDefaults(parsed, emptyData());
        DB.save(); render(); toast('復元しました','ok');
      }, '復元する');
  });
});

/* ===== 16-decisions.js ===== */
/* ============================================================
   16-decisions.js  重要な決定
   ------------------------------------------------------------
   会社として大きな決定をするときの、共通の手順。
     ・重要な決定は、話が持ち上がってから24時間おいて確定する
     ・新しい取り組みは、1枚にまとめて48時間おいてから判断する
     ・大きな決定には、反対の立場から意見を言う人を1名置く
   ============================================================ */

/* ---------- 判定ロジック ---------- */

function decisionKind(key){
  for(var i=0;i<DECISION_KINDS.length;i++) if(DECISION_KINDS[i].key===key) return DECISION_KINDS[i];
  return DECISION_KINDS[DECISION_KINDS.length-1];
}
/* 待ち時間が明ける時刻 */
function holdUntil(rec, hours){
  var base = rec.raisedAt || rec.createdAt;
  if(!base) return '';
  var t = new Date(base);
  if(isNaN(t.getTime())) return '';
  t.setHours(t.getHours() + num(hours, 24));
  return t.toISOString();
}
function hoursLeft(iso){
  if(!iso) return 0;
  return Math.max(0, hoursBetween(nowIso(), iso));
}
function holdLabel(iso){
  var h = hoursLeft(iso);
  if(h <= 0) return '<span class="badge ok">待ち時間が明けました</span>';
  if(h < 1) return '<span class="badge warn">あと'+Math.ceil(h*60)+'分</span>';
  return '<span class="badge warn">あと'+Math.ceil(h)+'時間</span>';
}

/* 確定してよい状態か。理由をつけて返す */
function decisionCanDecide(dec){
  var reasons = [];
  var until = holdUntil(dec, decisionKind(dec.kind).hold);
  if(hoursLeft(until) > 0)
    reasons.push('まだ24時間の待ち時間の中です（'+fmtJp(until)+'まで）。');
  if(!dec.devilName)
    reasons.push('反対の立場から意見を言う人が決まっていません。');
  if(!String(dec.devilNote||'').trim())
    reasons.push('反対意見の内容が記録されていません。');
  if(!String(dec.lossNow||'').trim() || !String(dec.lossWait||'').trim())
    reasons.push('「いま決めないことで失うもの」と「急いで決めて外したときに失うもの」の両方を書いてください。');
  return { ok:reasons.length===0, reasons:reasons };
}

/* 1枚企画書の充足度 */
function ventureFill(v){
  var miss = [];
  VENTURE_FIELDS.forEach(function(f){
    if(!String(v[f.key]||'').trim()) miss.push(f.label.replace(/（.*$/,''));
  });
  return { done:VENTURE_FIELDS.length-miss.length, total:VENTURE_FIELDS.length,
           rate:Math.round((VENTURE_FIELDS.length-miss.length)/VENTURE_FIELDS.length*100), missing:miss };
}
function ventureCanStart(v){
  var reasons = [];
  var fill = ventureFill(v);
  if(fill.missing.length) reasons.push('企画書の未記入：'+fill.missing.join('、'));
  var until = holdUntil(v, 48);
  if(hoursLeft(until) > 0) reasons.push('まだ48時間の待ち時間の中です（'+fmtJp(until)+'まで）。');
  return { ok:reasons.length===0, reasons:reasons, fill:fill };
}

/* 決定まわりの集計 */
function decisionStats(){
  var d = DB.data;
  var decs = d.decisions, vens = d.ventures;
  var decided = decs.filter(function(x){ return x.stage==='decided'; });
  /* 手順どおりの割合＝確定したもののうち、待ち時間を守ったもの */
  var kept = decided.filter(function(x){ return x.heldOk; }).length;
  var vStarted = vens.filter(function(v){ return v.stage==='approved'||v.stage==='running'||v.stage==='closed'; });
  var vFull = vens.filter(function(v){ return ventureFill(v).rate===100; }).length;
  var vExit = vens.filter(function(v){ return String(v.exitCond||'').trim(); }).length;
  return {
    total:decs.length, decided:decided.length, holding:decs.filter(function(x){return x.stage==='holding'||x.stage==='draft';}).length,
    holdRate: decided.length ? Math.round(kept/decided.length*100) : null,
    ventures:vens.length, started:vStarted.length,
    sheetRate: vens.length ? Math.round(vFull/vens.length*100) : null,
    exitRate:  vens.length ? Math.round(vExit/vens.length*100) : null
  };
}

/* ===== 17-delegation.js ===== */
/* ============================================================
   17-delegation.js  仕事の任せ方
   ------------------------------------------------------------
   任せきりにするのでも、細かく口を出すのでもなく、
   渡すときに6項目を決めて、決めた日に一度だけ確認する。
   その記録をここに残す。
   ============================================================ */

function delegationFill(dl){
  var miss = [];
  DELEGATION_FIELDS.forEach(function(f){
    if(!String(dl[f.key]||'').trim()) miss.push(f.label.replace(/^[①-⑥]\s*/,''));
  });
  return { done:DELEGATION_FIELDS.length-miss.length, total:DELEGATION_FIELDS.length,
           rate:Math.round((DELEGATION_FIELDS.length-miss.length)/DELEGATION_FIELDS.length*100),
           missing:miss };
}

/* 次の中間確認日（未実施のうち最も早いもの） */
function nextCheckDate(dl){
  var list = (dl.checks||[]).filter(function(c){ return !c.doneAt; });
  if(list.length) return sortBy(list, function(c){ return c.date; })[0].date;
  return dl.checkAt || '';
}

function delegationState(dl){
  if(dl.state && dl.state!=='open'){
    var s = DELEGATION_STATES.filter(function(x){ return x.key===dl.state; })[0];
    return { key:dl.state, label:s?s.label:dl.state, cls:s?s.cls:'neutral' };
  }
  var today = todayStr();
  var nc = nextCheckDate(dl);
  if(dl.due && dl.due < today) return { key:'overdue', label:'期限超過', cls:'bad' };
  if(nc && nc < today)         return { key:'checkLate', label:'中間確認が遅れ', cls:'bad' };
  if(nc && nc === today)       return { key:'checkToday', label:'今日が中間確認日', cls:'warn' };
  if(!nc)                      return { key:'noCheck', label:'中間確認日が未設定', cls:'bad' };
  return { key:'open', label:'進行中', cls:'accent' };
}

function delegationStats(){
  var list = DB.data.delegations;
  var open = list.filter(function(x){ return !x.state || x.state==='open'; });
  var checksAll = 0, checksDone = 0;
  list.forEach(function(dl){
    (dl.checks||[]).forEach(function(c){
      if(c.date <= todayStr()){ checksAll++; if(c.doneAt) checksDone++; }
    });
  });
  var full = list.filter(function(x){ return delegationFill(x).rate===100; }).length;
  var retry = list.filter(function(x){ return num(x.retryCount,0) > 0; }).length;
  return {
    total:list.length, open:open.length,
    fullRate: list.length ? Math.round(full/list.length*100) : null,
    checkRate: checksAll ? Math.round(checksDone/checksAll*100) : null,
    late: open.filter(function(x){ var s=delegationState(x); return s.cls==='bad'; }).length,
    retry:retry,
    feedback: list.filter(function(x){ return String(x.feedback||'').trim(); }).length
  };
}

/* ===== 18-capital.js ===== */
/* ============================================================
   18-capital.js  お金の使い道と、社外の関係者
   ------------------------------------------------------------
     ・利益が出た時点で、人材・営業・商品・仕組みへ戻す枠を先に取る
     ・新しい取り組みと、事業と関係ない支出には、年間の上限と承認を決める
     ・社外の関係者とは、狙い・権限・責任・成果物・終わり方を文書にする

   入力は四半期に一度、4つの数字を写すだけで済むようにしてある。
   1件ずつ記録したい場合は「明細で記録する」から入力できる。
   ============================================================ */

var capTab = 'capital';

function yen(n){
  n = num(n,0);
  return n.toLocaleString ? n.toLocaleString('ja-JP') : String(n);
}
function capitalRule(){
  var c = DB.data.capital || {};
  return c.rule || { reinvestRate:50, nonBizCap:0, approver:'', note:'' };
}
function spendsOf(period){
  var all = (DB.data.capital && DB.data.capital.spends) || [];
  return period ? all.filter(function(s){ return s.period===period; }) : all;
}
function capitalSummary(period){
  var list = spendsOf(period);
  var sum = { reinvest:0, venture:0, nonbiz:0, total:0, byCat:{} };
  REINVEST_CATEGORIES.forEach(function(c){ sum.byCat[c.key] = 0; });
  list.forEach(function(s){
    var a = num(s.amount,0);
    sum[s.kind] = (sum[s.kind]||0) + a;
    sum.total += a;
    if(s.kind==='reinvest' && s.category) sum.byCat[s.category] = (sum.byCat[s.category]||0) + a;
  });
  var periods = (DB.data.capital && DB.data.capital.periods) || [];
  var p = period ? periods.filter(function(x){ return x.label===period; })[0] : null;
  var profit = p ? num(p.profit,0) : periods.reduce(function(s,x){ return s+num(x.profit,0); }, 0);
  sum.profit = profit;
  sum.rate = profit>0 ? Math.round(sum.reinvest/profit*100) : null;
  sum.nonBizRate = profit>0 ? Math.round(sum.nonbiz/profit*100) : null;
  return sum;
}
function currentCapPeriod(){
  var periods = (DB.data.capital && DB.data.capital.periods) || [];
  if(!periods.length) return '';
  return sortBy(periods, function(p){ return p.label; }).slice(-1)[0].label;
}

/* 関係者台帳の整備状況 */
function partnerFill(p){
  var miss = [];
  PARTNER_FIELDS.forEach(function(f){
    if(!String(p[f.key]||'').trim()) miss.push(f.label.replace(/（.*$/,''));
  });
  if(!p.contractDone) miss.push('契約・合意の文書');
  return { done:PARTNER_FIELDS.length+1-miss.length, total:PARTNER_FIELDS.length+1,
           rate:Math.round((PARTNER_FIELDS.length+1-miss.length)/(PARTNER_FIELDS.length+1)*100),
           missing:miss };
}
function governanceRate(){
  var list = DB.data.partners;
  if(!list.length) return null;
  return Math.round(list.reduce(function(s,p){ return s+partnerFill(p).rate; },0)/list.length);
}

/* 四半期に一度、4つの数字を写すだけの入力。
   入れた数字は「まとめ」1件として記録に残す（明細と混ざらないように印を付ける）。 */
action('capQuick', function(){
  var period = currentCapPeriod() || quarterOf(todayStr());
  var sum = capitalSummary(period);
  /* 初期値は「まとめ」の行だけから作る。
     明細で入れた分まで足してしまうと、開いて保存するたびに二重に加算されてしまう。 */
  function rollupAmount(kind){
    return spendsOf(period).filter(function(s){ return s.rollup && s.kind === kind; })
      .reduce(function(a, s){ return a + num(s.amount, 0); }, 0);
  }
  openForm({
    title:'この期の数字を入れる', wide:true,
    intro:'<b>会計ソフトから、4つの数字を写すだけです。</b>'+
          '1件ずつ記録する必要はありません。四半期に一度、ここを更新してください。'+
          '<br>金額は「明細で記録する」で入れた分を含みません。まとめて入れる分だけを書いてください。',
    fields:[
      { key:'label',    label:'期', required:true, placeholder:'例：2026-Q3',
        hint:'四半期でも年度でも構いません。' },
      { key:'profit',   label:'この期の利益（円）', type:'number', required:true,
        hint:'税引前の利益でかまいません。おおよその数字で十分です。' },
      { key:'reinvest', label:'人材・営業・商品・仕組みへ使った額（円）', type:'number',
        hint:'研修、採用、広告、開発、業務システムなど。本業の力を上げるために使った合計。' },
      { key:'venture',  label:'新しい取り組みへ使った額（円）', type:'number',
        hint:'まだ本業になっていない、新規の事業や案件に使った合計。' },
      { key:'nonbiz',   label:'事業と関係ない支出（円）', type:'number',
        hint:'社用車、会員権など。ここを正直に分けることが、この画面のいちばんの価値です。' }
    ],
    value:{ label:period, profit:sum.profit||'', reinvest:rollupAmount('reinvest')||'',
            venture:rollupAmount('venture')||'', nonbiz:rollupAmount('nonbiz')||'' },
    submitLabel:'保存する',
    onSubmit:function(v){
      var c = DB.data.capital;
      /* 期（利益） */
      var p = c.periods.filter(function(x){ return x.label === v.label; })[0];
      if(p) p.profit = v.profit;
      else c.periods.push({ id:uid('cp'), label:v.label, profit:v.profit, note:'' });
      /* まとめの3行を作り直す（明細で入れたものは残す） */
      c.spends = c.spends.filter(function(x){ return !(x.rollup && x.period === v.label); });
      [['reinvest','人材・営業・商品・仕組みへ'],
       ['venture','新しい取り組みへ'],
       ['nonbiz','事業と関係ない支出']].forEach(function(pair){
        var amt = num(v[pair[0]], 0);
        if(!amt) return;
        c.spends.push({ id:uid('sp'), rollup:true, date:todayStr(), period:v.label,
                        title:pair[1]+'（'+v.label+' まとめ）', kind:pair[0], amount:amt, note:'' });
      });
      DB.save(); render(); toast('保存しました','ok');
    }
  });
});

/* ===== 19-diagnosis.js ===== */
/* ============================================================
   19-diagnosis.js  組織の健康診断
   ------------------------------------------------------------
   売上は結果なので、変化が数字に出るまでに時間がかかる。
   その手前で動く6つの数字を、日々の記録から自動で計算して見る画面。
     ・売上より先に動く6つの数字
     ・組織が陥りやすい5つの悪循環の、いまの度合い
     ・半年に一度の振り返り質問
   ============================================================ */

/* 0〜100 に丸めるヘルパー */
function _sc(v){ return v===null||v===undefined||!isFinite(v) ? null : clamp(Math.round(v),0,100); }
function _avg(arr){
  var a = arr.filter(function(x){ return x!==null && x!==undefined && isFinite(x); });
  return a.length ? Math.round(a.reduce(function(s,x){return s+x;},0)/a.length) : null;
}
function scoreCls(v){ return v===null?'':(v>=75?'ok':v>=50?'warn':'bad'); }

/* 営業の先行指標が週次KPIに載っているか（接触・商談・提案・失注） */
function salesLeadingUse(){
  var re = /(接触|架電|訪問|アポ|商談|提案|失注|リード|問い合わせ)/;
  var weeks = sortBy(DB.data.kpiWeeks, function(w){ return w.weekOf; }).slice(-4);
  if(!weeks.length) return { weeks:0, hit:0, rate:null };
  var hit = weeks.filter(function(w){
    return (w.rows||[]).some(function(r){ return re.test(String(r.indicator||'')); });
  }).length;
  return { weeks:weeks.length, hit:hit, rate:Math.round(hit/weeks.length*100) };
}

/* 悪い情報が上がるまでの平均時間 */
function reportSpeed(){
  var reps = DB.data.reports.filter(function(r){ return !r.needApproval && r.knownAt && r.reportedAt; });
  if(!reps.length) return { n:0, avg:null };
  var sum = reps.reduce(function(s,r){ return s + Math.max(0, hoursBetween(r.knownAt, r.reportedAt)); }, 0);
  return { n:reps.length, avg:Math.round(sum/reps.length*10)/10 };
}

/* 評価者ごとの平均点の開き（甘辛の差） */
function evaluatorSpread(){
  var period = DB.data.settings.currentPeriod;
  var byEval = {};
  DB.data.evaluations.filter(function(e){ return e.period===period; }).forEach(function(e){
    var s = evalScore(e); if(s===null) return;
    var k = e.evaluatorId || '_';
    (byEval[k] = byEval[k] || []).push(s);
  });
  var avgs = [];
  for(var k in byEval){
    var a = byEval[k];
    avgs.push(a.reduce(function(s,x){return s+x;},0)/a.length);
  }
  if(avgs.length < 2) return null;
  return Math.round((Math.max.apply(null,avgs) - Math.min.apply(null,avgs))*100)/100;
}

/* ---------- 表7：90日で追うべき先行指標 ---------- */
function leadingMetrics(){
  var d = DB.data;
  var out = {};

  /* 情報流通 */
  var rs = reportSpeed(), rc = reportCompliance();
  var infoScore = rs.avg===null ? null :
    _sc(clamp(100 - rs.avg*3, 0, 100)*0.5 + (rc.total?rc.rate:0)*0.5);
  out.info = { score:infoScore,
    value: rs.avg===null ? '記録なし' : '平均 '+rs.avg+'時間で第一報',
    note: rc.total ? '期限遵守 '+rc.rate+'%（'+rc.total+'件）' : '報告ログがまだありません' };

  /* 育成 */
  var ds = delegationStats();
  out.growth = { score:_avg([ds.checkRate, ds.fullRate]),
    value: ds.checkRate===null ? '記録なし' : '中間確認 '+ds.checkRate+'%',
    note: ds.total ? '委任'+ds.total+'件／6項目記入 '+(ds.fullRate===null?'—':ds.fullRate+'%')+'／再挑戦 '+ds.retry+'件'
                   : '任せた仕事をカードにすると測れます' };

  /* 人材定着 */
  var oo = oneOnOneRate();
  var emps = d.employees.filter(function(e){ return !e.isTop; });
  var nextRole = emps.length ? Math.round(emps.filter(function(e){ return String(e.nextRole||'').trim(); }).length/emps.length*100) : null;
  out.retain = { score:_avg([oo.total?oo.rate:null, nextRole]),
    value: oo.total ? '1on1実施 '+oo.rate+'%' : '対象者なし',
    note: (nextRole===null?'':'これからの役割を伝えられている人 '+nextRole+'%') };

  /* 営業 */
  var sl = salesLeadingUse();
  out.sales = { score:sl.rate,
    value: sl.rate===null ? '週次KPIの記録なし' : '直近'+sl.weeks+'週中'+sl.hit+'週で先行指標を確認',
    note: '接触・商談・提案・失注理由を、売上より先に見る' };

  /* 資本配分 */
  var period = currentCapPeriod();
  var cs = capitalSummary(period);
  var rule = capitalRule();
  var capScore = cs.rate===null ? null : _sc(cs.rate / Math.max(1, num(rule.reinvestRate,50)) * 100);
  out.capital = { score:capScore,
    value: cs.rate===null ? '利益の登録なし' : '再投資率 '+cs.rate+'%',
    note: '目標 '+num(rule.reinvestRate,50)+'%'+(cs.nonbiz?'／非事業支出 '+yen(cs.nonbiz)+'円':'') };

  /* 意思決定 */
  var dec = decisionStats();
  out.decision = { score:_avg([dec.holdRate, dec.sheetRate, dec.exitRate]),
    value: dec.total||dec.ventures ? '決裁'+dec.total+'件／企画書'+dec.ventures+'件' : '記録なし',
    note: (dec.holdRate===null?'':'手順どおりに確定 '+dec.holdRate+'%')+
          (dec.exitRate===null?'':'／撤退条件 '+dec.exitRate+'%') };

  return out;
}

/* ---------- 5つの強化ループのリスク判定 ---------- */
function loopScores(){
  var d = DB.data, m = leadingMetrics(), out = {};
  var ds = delegationStats(), oo = oneOnOneRate();

  /* R1 育成放棄 */
  var fbRate = d.oneOnOnes.length ?
    Math.round(d.oneOnOnes.filter(function(o){ return String(o.feedback||'').trim(); }).length/d.oneOnOnes.length*100) : null;
  out.R1 = { score:_avg([ds.checkRate, ds.fullRate, fbRate]),
    facts:[
      { label:'中間確認の実施率', v:ds.checkRate===null?'—':ds.checkRate+'%' },
      { label:'委任6項目の記入率', v:ds.fullRate===null?'—':ds.fullRate+'%' },
      { label:'1on1で具体的なフィードバックを残した割合', v:fbRate===null?'—':fbRate+'%' },
      { label:'再挑戦の機会を作った委任', v:ds.retry+'件' }
    ]};

  /* R2 優秀者流出 */
  var emps = d.employees.filter(function(e){ return !e.isTop; });
  var nextRole = emps.length ? Math.round(emps.filter(function(e){ return String(e.nextRole||'').trim(); }).length/emps.length*100) : null;
  var comp = d.goals.filter(function(g){ return g.level==='company'; });
  var visionScore = comp.length ? clamp(Math.round(comp.length/3*100),0,100) : 0;
  var grade = emps.length ? Math.round(emps.filter(function(e){ return !!e.grade; }).length/emps.length*100) : null;
  out.R2 = { score:_avg([nextRole, visionScore, grade, oo.total?oo.rate:null]),
    facts:[
      { label:'これからの役割を伝えられている人', v:nextRole===null?'—':nextRole+'%' },
      { label:'等級が決まっている人', v:grade===null?'—':grade+'%' },
      { label:'会社目標（進む方向）の数', v:comp.length+'個' },
      { label:'中身を知っているのが1人だけの仕事', v:d.employees.filter(function(e){return e.ceoOnlyKnows;}).length+'件' }
    ]};

  /* R3 営業・再投資回避 */
  var sl = salesLeadingUse();
  var dec = decisionStats();
  var rule = capitalRule();
  out.R3 = { score:_avg([sl.rate, m.capital.score, dec.sheetRate]),
    facts:[
      { label:'週次で営業の先行指標を見た週', v:sl.rate===null?'—':sl.hit+'/'+sl.weeks+'週' },
      { label:'再投資率', v:m.capital.value },
      { label:'非事業支出の年間上限', v:num(rule.nonBizCap,0)>0 ? yen(rule.nonBizCap)+'円' : '未設定' },
      { label:'新規案件の1枚企画書の記入率', v:dec.sheetRate===null?'—':dec.sheetRate+'%' }
    ]};

  /* R4 ガバナンス崩壊 */
  var gr = governanceRate();
  var rc = reportCompliance();
  var noContract = d.partners.filter(function(p){ return !p.contractDone; }).length;
  out.R4 = { score:_avg([gr, rc.total?rc.rate:null]),
    facts:[
      { label:'関係者台帳の文書化', v:gr===null?'—（未登録）':gr+'%' },
      { label:'契約・合意が文書化されていない相手', v:noContract+'件' },
      { label:'報告期限の遵守率', v:rc.total?rc.rate+'%':'—' },
      { label:'期限を守れなかった報告', v:rc.late.length+'件' },
      { label:'例外の記録', v:d.exceptions.length+'件' }
    ]};

  /* R5 低基準固定 */
  var scRate = clamp(Math.round(d.scorecards.length/6*100),0,100);
  var period = d.settings.currentPeriod;
  var evs = d.evaluations.filter(function(e){ return e.period===period; });
  var evRate = d.employees.length ? Math.round(evs.length/d.employees.length*100) : null;
  var spread = evaluatorSpread();
  var spreadScore = spread===null ? null : _sc(100 - spread*80);
  var goalFull = d.goals.length ?
    Math.round(d.goals.filter(function(g){ return g.owner && g.dataSource; }).length/d.goals.length*100) : null;
  out.R5 = { score:_avg([scRate, evRate, spreadScore, goalFull]),
    facts:[
      { label:'職種別役割表（良い状態の定義）', v:d.scorecards.length+'職種' },
      { label:'当期の評価シート作成率', v:evRate===null?'—':evRate+'%' },
      { label:'評価者ごとの平均点の開き', v:spread===null?'—':spread+'点' },
      { label:'責任者と正とするデータが揃った目標', v:goalFull===null?'—':goalFull+'%' }
    ]};

  return out;
}

/* 検証質問の集計 */
function diagnosisAnswers(){
  return (DB.data.diagnosis && DB.data.diagnosis.answers) || {};
}
function diagnosisSummary(){
  var a = diagnosisAnswers(), yes=0, no=0, mid=0, total=0, upstreamNo=[];
  DIAGNOSIS_SECTIONS.forEach(function(s){
    s.items.forEach(function(it){
      total++;
      var v = a[it.key];
      if(v==='yes') yes++;
      else if(v==='no'){ no++; if(it.up) upstreamNo.push(it); }
      else if(v==='mid') mid++;
    });
  });
  var answered = yes+no+mid;
  return { total:total, answered:answered, yes:yes, no:no, mid:mid,
           rate: answered ? Math.round((yes + mid*0.5)/answered*100) : null,
           upstreamNo:upstreamNo };
}

/* 総合：正の循環スコア */
function positiveCycleScore(){
  var m = leadingMetrics();
  var arr = LEADING_INDICATORS.map(function(x){ return m[x.key].score; });
  var data = _avg(arr);
  var q = diagnosisSummary();
  if(data===null && q.rate===null) return null;
  if(data===null) return q.rate;
  if(q.rate===null) return data;
  return Math.round(data*0.65 + q.rate*0.35);
}

/* ===== 20-sync.js ===== */
/* ============================================================
   20-sync.js  データの共有（会社のメンバーと一緒に使うための同期）
   ------------------------------------------------------------
   3つのモードがある。

   local   … このパソコンのブラウザだけに保存する（既定）
   folder  … 会社の共有フォルダ（OneDrive / SharePoint / Googleドライブの
             同期フォルダ）に置いた1つのJSONファイルを、全員で読み書きする。
             サーバーも登録も不要。Chrome / Edge で動く。
   server  … 共有サーバー（Cloudflare Workers など）に置いたデータを
             全員で読み書きする。社外からでも同じデータを見られる。

   どのモードでも、ブラウザ内の保存（localStorage）は残るため、
   一時的に共有先へつながらなくても作業は続けられる。
   ============================================================ */

var SYNC_KEY  = 'hyokaSeido_sync_v1';
var SYNC_FILE = 'org-ops-data.json';

var SYNC = {
  cfg: { mode:'local', serverUrl:'', teamKey:'', userName:'', fileName:SYNC_FILE, auto:true },
  dirHandle:null,
  state:'idle',        /* idle | ready | syncing | error | needPermission */
  message:'',
  lastPulledAt:'',     /* 最後に取り込んだ相手側の更新時刻 */
  lastPushedAt:'',
  dirty:false,         /* まだ共有先へ送れていない変更が手元にあるか */
  rev:0,
  timer:null,
  saveTimer:null,
  busy:false
};

/* ---------- 設定の保存 ---------- */
function syncLoadCfg(){
  try{
    var raw = localStorage.getItem(SYNC_KEY);
    if(raw){
      var p = JSON.parse(raw);
      for(var k in p) SYNC.cfg[k] = p[k];
    }
  }catch(e){}
  if(!SYNC.cfg.fileName) SYNC.cfg.fileName = SYNC_FILE;
  return SYNC.cfg;
}
function syncSaveCfg(){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC.cfg)); }catch(e){}
}
function syncSupported(){
  return typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';
}
function syncModeLabel(){
  if(SYNC.cfg.mode==='folder') return '共有フォルダ';
  if(SYNC.cfg.mode==='server') return '共有サーバー';
  return 'このパソコンのみ';
}

/* ---------- 小さな IndexedDB（フォルダの許可を次回も覚えておくため） ---------- */
function idbOpen(){
  return new Promise(function(res, rej){
    if(typeof indexedDB === 'undefined'){ rej(new Error('indexedDB なし')); return; }
    var r = indexedDB.open('orgops-sync', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbPut(key, val){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = function(){ res(true); };
      tx.onerror = function(){ rej(tx.error); };
    });
  }).catch(function(){ return false; });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction('kv','readonly');
      var q = tx.objectStore('kv').get(key);
      q.onsuccess = function(){ res(q.result); };
      q.onerror = function(){ res(null); };
    });
  }).catch(function(){ return null; });
}

/* ---------- 共通：取り込み・書き出しの中身 ---------- */
function syncPayload(){
  return {
    app:'org-ops', version:APP_VERSION,
    updatedAt: DB.data.meta.updatedAt,
    updatedBy: SYNC.cfg.userName || '（名前未設定）',
    data: DB.data
  };
}
function syncApply(payload, from){
  if(!payload || !payload.data){ return false; }
  DB.data = mergeDefaults(payload.data, emptyData());
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB.data)); }catch(e){}
  SYNC.lastPulledAt = payload.updatedAt || nowIso();
  SYNC.dirty = false;
  SYNC.message = (from||'共有先')+'から取り込みました（'+fmtJp(payload.updatedAt)+
                 (payload.updatedBy?'／'+payload.updatedBy:'')+'）';
  return true;
}
function syncStatusHtml(){
  var cls = SYNC.state==='error' ? 'bad' : (SYNC.cfg.mode==='local' ? 'neutral' : (SYNC.state==='ready'?'ok':'warn'));
  var txt = syncModeLabel();
  if(SYNC.cfg.mode!=='local'){
    if(SYNC.state==='syncing')        txt += '：同期中';
    else if(SYNC.state==='ready')     txt += '：同期済み';
    else if(SYNC.state==='needPermission') txt += '：許可が必要';
    else if(SYNC.state==='error')     txt += '：エラー';
  }
  return '<span class="badge '+cls+'" data-act="go" data-view="settings" style="cursor:pointer;" title="'+
         esc(SYNC.message||'共有の設定を開く')+'">'+esc(txt)+'</span>';
}
function syncPaint(){
  var el = (typeof document!=='undefined') ? document.getElementById('syncBadge') : null;
  if(el) el.innerHTML = syncStatusHtml();
}

/* ============================================================
   共有フォルダモード
   ============================================================ */
function folderPick(){
  if(!syncSupported()){
    toast('このブラウザは共有フォルダに対応していません。Chrome または Edge をお使いください。','bad');
    return Promise.resolve(false);
  }
  return window.showDirectoryPicker({ mode:'readwrite' }).then(function(h){
    SYNC.dirHandle = h;
    return idbPut('dirHandle', h);
  }).then(function(){
    return folderFirstSync();
  }).catch(function(e){
    if(e && e.name === 'AbortError') return false;
    SYNC.state='error'; SYNC.message = 'フォルダを開けませんでした：'+(e&&e.message||e);
    toast(SYNC.message,'bad'); syncPaint();
    return false;
  });
}

function folderEnsure(){
  if(!SYNC.dirHandle) return Promise.resolve(false);
  if(!SYNC.dirHandle.queryPermission) return Promise.resolve(true);
  return SYNC.dirHandle.queryPermission({ mode:'readwrite' }).then(function(p){
    if(p === 'granted') return true;
    SYNC.state = 'needPermission';
    SYNC.message = '共有フォルダを使う許可が必要です。「共有フォルダに接続」を押してください。';
    syncPaint();
    return false;
  }).catch(function(){ return false; });
}

function folderRead(){
  return SYNC.dirHandle.getFileHandle(SYNC.cfg.fileName, { create:true })
    .then(function(fh){ return fh.getFile(); })
    .then(function(f){
      if(f.size === 0) return null;
      return f.text().then(function(t){
        try{ return JSON.parse(t); }catch(e){ return null; }
      });
    });
}
function folderWrite(){
  return SYNC.dirHandle.getFileHandle(SYNC.cfg.fileName, { create:true })
    .then(function(fh){ return fh.createWritable(); })
    .then(function(w){
      return w.write(JSON.stringify(syncPayload(), null, 2)).then(function(){ return w.close(); });
    }).then(function(){
      SYNC.lastPushedAt = DB.data.meta.updatedAt;
      SYNC.lastPulledAt = DB.data.meta.updatedAt;
      SYNC.dirty = false;
      return true;
    });
}

/* 初回の接続。共有フォルダにすでにチームのデータがあるときは、
   どちらを残すかを必ず選んでもらう（黙って上書きしない）。
   選び終わるまで共有フォルダのモードには切り替えない。 */
function folderLink(){ SYNC.cfg.mode = 'folder'; syncSaveCfg(); }

function folderFirstSync(){
  return folderEnsure().then(function(ok){
    if(!ok) return false;
    return folderRead().then(function(remote){
      /* 共有フォルダが空 → こちらの内容を最初のデータとして置く */
      if(!remote || !remote.data){
        return folderWrite().then(function(){
          folderLink();
          SYNC.state = 'ready';
          SYNC.message = '共有フォルダへ保存しました（'+fmtJp(nowIso())+'）';
          syncPaint();
          return 'push';
        });
      }
      return new Promise(function(res){
        openModal({
          title:'共有フォルダには、すでにデータがあります',
          body:'<div style="font-size:13.5px;line-height:1.8;">'+
               '共有フォルダの更新：'+esc(fmtJp(remote.updatedAt))+
               (remote.updatedBy?'（'+esc(remote.updatedBy)+'）':'')+'<br>'+
               'このパソコンの更新：'+esc(fmtJp(DB.data.meta.updatedAt))+'<br><br>'+
               'どちらの内容を残しますか。<br>'+
               '<b>取り込む</b>を選ぶと、このパソコンの内容が共有フォルダの内容に置き換わります。<br>'+
               '<b>自分の内容で上書きする</b>を選ぶと、共有フォルダにあるチーム全員分のデータが消えます。'+
               '</div>',
          foot:'<button type="button" class="btn danger" id="fsPush">自分の内容で上書きする</button>'+
               '<button type="button" class="btn primary" id="fsPull">共有フォルダの内容を取り込む（推奨）</button>',
          onMount:function(root){
            root.beforeClose = function(){ res(false); return true; };
            root.querySelector('#fsPull').addEventListener('click', function(){
              closeModal();
              syncApply(remote, '共有フォルダ');
              folderLink();
              SYNC.state = 'ready'; syncPaint(); render();
              res('pull');
            });
            root.querySelector('#fsPush').addEventListener('click', function(){
              closeModal();
              folderWrite().then(function(){
                folderLink();
                SYNC.state = 'ready';
                SYNC.message = '共有フォルダへ保存しました（'+fmtJp(nowIso())+'）';
                syncPaint();
                res('push');
              });
            });
          }
        });
      });
    });
  });
}

/* 取り込みと書き出しをまとめて行う。force=true なら競合時に自分を優先 */
function folderSync(silent){
  if(SYNC.busy) return Promise.resolve(false);
  SYNC.busy = true; SYNC.state='syncing'; syncPaint();
  return folderEnsure().then(function(ok){
    if(!ok){ return false; }
    return folderRead().then(function(remote){
      /* 相手側が空 → こちらを書き出す */
      if(!remote) return folderWrite().then(function(){ return 'push'; });

      var rt = remote.updatedAt || '';
      var mine = DB.data.meta.updatedAt || '';
      /* まだ共有先へ送れていない変更が手元にあるときは、時刻では勝ち負けを決めない。
         パソコンの時計が数分ずれているだけで、いま入力した内容が黙って消えてしまうため。 */
      if(SYNC.dirty){
        if(rt === SYNC.lastPulledAt) return folderWrite().then(function(){ return 'push'; });
        syncConflictDialog(remote);
        return 'conflict';
      }
      if(rt === SYNC.lastPulledAt && mine > (SYNC.lastPushedAt||'')) return folderWrite().then(function(){ return 'push'; });
      if(rt > mine){ syncApply(remote, '共有フォルダ'); return 'pull'; }
      if(rt < mine) return folderWrite().then(function(){ return 'push'; });
      SYNC.lastPulledAt = rt;
      return 'same';
    });
  }).then(function(r){
    if(r==='conflict'){
      SYNC.state='error'; SYNC.message='他の人が先に更新しています。';
    }else if(r){
      SYNC.state='ready';
      if(r==='pull'){ if(!silent) toast(SYNC.message,'ok'); render(); }
      else if(r==='push'){ SYNC.message = '共有フォルダへ保存しました（'+fmtJp(nowIso())+'）'; }
    }
    SYNC.busy=false; syncPaint(); return r;
  }).catch(function(e){
    SYNC.busy=false; SYNC.state='error';
    SYNC.message = '共有フォルダの読み書きに失敗しました：'+(e&&e.message||e);
    syncPaint();
    return false;
  });
}

/* ============================================================
   共有サーバーモード
   ============================================================ */
function serverUrl(path){
  var b = String(SYNC.cfg.serverUrl||'').replace(/\/+$/,'');
  return b + path;
}
function serverHeaders(){
  return { 'Content-Type':'application/json', 'X-Team-Key': SYNC.cfg.teamKey||'' };
}
function serverPull(silent){
  if(!SYNC.cfg.serverUrl) return Promise.resolve(false);
  SYNC.state='syncing'; syncPaint();
  return fetch(serverUrl('/api/data'), { headers:serverHeaders(), cache:'no-store' })
    .then(function(r){
      if(r.status===401) throw new Error('合言葉（チームキー）が違います');
      if(!r.ok) throw new Error('サーバー応答 '+r.status);
      return r.json();
    })
    .then(function(j){
      if(j && j.data){
        SYNC.rev = j.rev||0;
        syncApply(j, '共有サーバー');
        SYNC.state='ready'; syncPaint();
        if(!silent){ toast(SYNC.message,'ok'); }
        render();
        return true;
      }
      SYNC.rev = j && j.rev || 0;
      SYNC.state='ready'; syncPaint();
      return false;
    })
    .catch(function(e){
      SYNC.state='error'; SYNC.message='共有サーバーに接続できません：'+(e&&e.message||e);
      syncPaint(); if(!silent) toast(SYNC.message,'bad');
      return false;
    });
}
function serverPush(force){
  if(!SYNC.cfg.serverUrl) return Promise.resolve(false);
  SYNC.state='syncing'; syncPaint();
  var body = JSON.stringify({ rev: force?-1:SYNC.rev, payload: syncPayload() });
  return fetch(serverUrl('/api/data'), { method:'PUT', headers:serverHeaders(), body:body })
    .then(function(r){
      if(r.status===409) return r.json().then(function(j){ return { conflict:true, remote:j }; });
      if(r.status===401) throw new Error('合言葉（チームキー）が違います');
      if(!r.ok) throw new Error('サーバー応答 '+r.status);
      return r.json();
    })
    .then(function(j){
      if(j && j.conflict){
        SYNC.state='error';
        SYNC.message = '他の人が先に更新しています。';
        syncPaint();
        syncConflictDialog(j.remote);
        return false;
      }
      SYNC.rev = j.rev||SYNC.rev+1;
      SYNC.lastPushedAt = DB.data.meta.updatedAt;
      SYNC.lastPulledAt = DB.data.meta.updatedAt;
      SYNC.dirty = false;
      SYNC.state='ready'; SYNC.message='共有サーバーへ保存しました（'+fmtJp(nowIso())+'）';
      syncPaint();
      return true;
    })
    .catch(function(e){
      SYNC.state='error'; SYNC.message='保存できませんでした：'+(e&&e.message||e);
      syncPaint(); toast(SYNC.message,'bad');
      return false;
    });
}

function syncConflictDialog(remote){
  openModal({
    title:'他の人が先に更新しています',
    body:'<div class="alert warn"><span class="ic">'+ic('info',15)+'</span><div class="body">'+
      '<div class="t">共有先のデータが、あなたが開いたあとに更新されました</div>'+
      '<div class="d">相手の更新：'+esc(fmtJp(remote&&remote.updatedAt))+
      (remote&&remote.updatedBy?'（'+esc(remote.updatedBy)+'）':'')+'</div></div></div>'+
      '<div class="help-block">どちらかを選んでください。'+
      '迷ったら、先に「相手の内容を取り込む」を押し、自分の変更をもう一度入力するのが安全です。</div>',
    foot:'<button class="btn" data-act="syncPullForce">相手の内容を取り込む（自分の変更は消えます）</button>'+
         '<button class="btn danger" data-act="syncPushForce">自分の内容で上書きする</button>'
  });
}

/* ============================================================
   共通の入り口
   ============================================================ */
function syncNow(silent){
  if(SYNC.cfg.mode==='folder') return folderSync(silent);
  if(SYNC.cfg.mode==='server'){
    /* サーバーは「取り込む→自分が新しければ書き出す」の順 */
    return fetch(serverUrl('/api/meta'), { headers:serverHeaders(), cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(meta){
        if(!meta) return serverPull(silent);
        /* まだ共有先へ送れていない変更が手元にあるときは、時刻では勝ち負けを決めない。
           パソコンの時計が数分ずれているだけで、いま入力した内容が黙って消えてしまうため。
           このときは版数（rev）で競合を見てもらう。 */
        if(SYNC.dirty) return serverPush(false);
        /* 先に版数を合わせておく。これをしないと、保存のたびに競合と判定されてしまう */
        if(typeof meta.rev === 'number') SYNC.rev = meta.rev;
        var mine = DB.data.meta.updatedAt||'';
        if((meta.updatedAt||'') > mine) return serverPull(silent);
        if(mine > (SYNC.lastPushedAt||'')) return serverPush(false);
        SYNC.rev = meta.rev||SYNC.rev; SYNC.state='ready'; syncPaint();
        return true;
      })
      .catch(function(e){
        SYNC.state='error'; SYNC.message='共有サーバーに接続できません：'+(e&&e.message||e);
        syncPaint(); if(!silent) toast(SYNC.message,'bad');
        return false;
      });
  }
  return Promise.resolve(false);
}

/* 保存のたびに呼ばれる（連打しても1回にまとめる） */
function syncAfterSave(){
  SYNC.dirty = true;
  if(SYNC.cfg.mode==='local' || !SYNC.cfg.auto) return;
  if(typeof setTimeout === 'undefined') return;
  clearTimeout(SYNC.saveTimer);
  SYNC.saveTimer = setTimeout(function(){
    if(SYNC.cfg.mode==='folder') folderSync(true);
    else serverPush(false);
  }, 1500);
}

/* 定期的に相手側の変更を見に行く */
function syncStartTimer(){
  if(typeof setInterval === 'undefined') return;
  clearInterval(SYNC.timer);
  if(SYNC.cfg.mode==='local') return;
  SYNC.timer = setInterval(function(){
    if(SYNC.busy) return;
    if(typeof document!=='undefined' && document.querySelector('.modal-back')) return;  /* 入力中は邪魔しない */
    syncNow(true);
  }, 15000);
}

function syncInit(){
  syncLoadCfg();
  if(typeof document === 'undefined') return;
  syncPaint();
  if(SYNC.cfg.mode==='folder'){
    idbGet('dirHandle').then(function(h){
      if(!h){ SYNC.state='needPermission';
              SYNC.message='共有フォルダの場所を、もう一度選んでください。'; syncPaint(); return; }
      SYNC.dirHandle = h;
      return folderEnsure().then(function(ok){ if(ok) return folderSync(true); });
    }).then(function(){ syncStartTimer(); });
  }else if(SYNC.cfg.mode==='server'){
    syncNow(true).then(function(){ syncStartTimer(); });
  }
}

/* ---------- 設定画面から呼ばれる操作 ---------- */
action('syncPickFolder', function(){
  folderPick().then(function(ok){
    if(ok!==false){ syncStartTimer(); render(); toast('共有フォルダに接続しました','ok'); }
  });
});

action('syncModeLocal', function(){
  confirmDialog('このパソコンのみに戻す',
    '共有をやめて、このパソコンのブラウザだけにデータを保存する状態に戻します。\n'+
    '共有フォルダやサーバーにある内容は消えません。よろしいですか？',
    function(){
      SYNC.cfg.mode='local'; syncSaveCfg();
      clearInterval(SYNC.timer); SYNC.state='idle'; SYNC.message='';
      render(); toast('このパソコンのみの保存に戻しました','ok');
    }, '戻す');
});

action('syncServerSave', function(){
  var view = document.getElementById('view');
  var url = view.querySelector('[name="f_serverUrl"]');
  var key = view.querySelector('[name="f_teamKey"]');
  var nm  = view.querySelector('[name="f_userName"]');
  SYNC.cfg.serverUrl = url ? String(url.value).trim() : '';
  SYNC.cfg.teamKey   = key ? String(key.value).trim() : '';
  if(nm) SYNC.cfg.userName = String(nm.value).trim();
  if(!SYNC.cfg.serverUrl){ toast('共有サーバーのアドレスを入力してください','bad'); return; }
  SYNC.cfg.mode = 'server';
  syncSaveCfg();
  toast('接続しています…','');
  serverPull(false).then(function(ok){
    if(SYNC.state!=='error'){
      /* サーバーが空のときは、こちらの内容を最初のデータとして送る */
      if(!ok) serverPush(true);
      syncStartTimer();
    }
    render();
  });
});

  var nm = view.querySelector('[name="f_userName"]');
  if(nm){ SYNC.cfg.userName = String(nm.value).trim(); syncSaveCfg(); toast('保存しました','ok'); render(); }
});

action('syncNow', function(){
  toast('同期しています…','');
  syncNow(false).then(function(){ render(); });
});

action('syncPullForce', function(){
  closeModal();
  if(SYNC.cfg.mode==='server'){
    serverPull(false).then(function(){ render(); });
  }else if(SYNC.cfg.mode==='folder'){
    folderRead().then(function(remote){
      if(remote){ syncApply(remote,'共有フォルダ'); render(); toast('取り込みました','ok'); }
    });
  }
});

action('syncPushForce', function(){
  closeModal();
  if(SYNC.cfg.mode==='server'){
    serverPush(true).then(function(){ render(); toast('上書き保存しました','ok'); });
  }else if(SYNC.cfg.mode==='folder'){
    folderWrite().then(function(){ render(); toast('上書き保存しました','ok'); });
  }
});

/* ============================================================
   99-app.js  ナビゲーション・画面切替・起動
   ============================================================ */

var NAV = [
  { group:'' , items:[
    { key:'me',          label:'わたしの画面',     icon:'home' },
    { key:'dashboard',   label:'会社全体',         icon:'chart' }
  ]},
  { group:'毎週・毎月つかう', items:[
    { key:'kpi',         label:'週次KPI会議',      icon:'trending' },
    { key:'delegation',  label:'仕事の任せ方',     icon:'handoff' },
    { key:'oneonone',    label:'月次1on1',         icon:'chat' },
    { key:'reports',     label:'報告・承認ルール', icon:'bell' }
  ]},
  { group:'折々につかう', items:[
    { key:'evaluations', label:'四半期評価',       icon:'star' },
    { key:'goals',       label:'会社・部門目標',   icon:'target' },
    { key:'improvement', label:'改善サポート',     icon:'rise' },
    { key:'decisions',   label:'重要な決定',       icon:'shield' }
  ]},
  { group:'台帳と基準', items:[
    { key:'employees',   label:'社員・役割台帳',   icon:'users' },
    { key:'org',         label:'組織・権限マップ', icon:'sitemap' },
    { key:'scorecards',  label:'職種別役割表',     icon:'clipboard' },
    { key:'grades',      label:'等級制度',         icon:'layers' }
  ]},
  { group:'経営の振り返り', items:[
    { key:'capital',     label:'お金の使い道',     icon:'wallet' },
    { key:'diagnosis',   label:'組織の健康診断',   icon:'pulse' }
  ]},
  { group:'', items:[
    { key:'settings',    label:'設定・データ',     icon:'settings' }
  ]}
];

var currentView = 'me';

function navCount(key){
  var d = DB.data;
  switch(key){
    case 'me': {
      if(typeof myEmpId !== 'function' || !myEmpId()) return 0;
      var n = myOpenActions().filter(function(a){ return a.due && a.due < todayStr(); }).length;
      n += myDelegations().filter(function(x){
        var nc = nextCheckDate(x); return nc && nc <= todayStr();
      }).length;
      if(!myOneOnOne().thisMonth) n += 1;
      return n;
    }
    case 'employees':   return d.employees.length;
    case 'goals':       return d.goals.length;
    case 'scorecards':  return d.scorecards.length;
    case 'kpi':         return d.kpiWeeks.length;
    case 'oneonone':    return d.oneOnOnes.filter(function(o){ return o.month === monthStr(); }).length;
    case 'evaluations': return d.evaluations.filter(function(e){ return e.period === currentPeriod(); }).length;
    case 'improvement': return d.improvementPlans.filter(function(p){ return p.status !== 'closed'; }).length;
    case 'reports':     return d.reports.length;
    case 'delegation':  return d.delegations.filter(function(x){ return !x.state || x.state==='open'; }).length;
    case 'decisions':   return d.decisions.filter(function(x){ return x.stage!=='decided' && x.stage!=='dropped'; }).length;
    case 'capital':     return d.partners.length;
    default: return 0;
  }
}

function renderNav(){
  var alerts = buildAlerts();
  var attn = {};
  alerts.forEach(function(a){ if(a.level==='bad') attn[a.view] = (attn[a.view]||0)+1; });

  var h = '';
  NAV.forEach(function(g){
    if(g.group) h += '<div class="nav-group">'+esc(g.group)+'</div>';
    g.items.forEach(function(it){
      var n = navCount(it.key);
      var bad = attn[it.key];
      var v = VIEWS[it.key];
      h += '<button type="button" class="nav-item '+(currentView===it.key?'active':'')+'" '+
        'data-act="go" data-view="'+it.key+'"'+(currentView===it.key?' aria-current="page"':'')+' '+
        'title="'+esc(v && v.desc ? v.desc : it.label)+'">'+
        ic(it.icon, 17)+
        '<span class="lb">'+esc(it.label)+'</span>'+
        (bad ? '<span class="count attn" title="対応が必要 '+bad+'件">'+bad+'</span>' :
         (n ? '<span class="count">'+n+'</span>' : ''))+
        '</button>';
    });
  });
  return h;
}

function render(){
  var v = VIEWS[currentView] || VIEWS.dashboard;
  document.getElementById('nav').innerHTML = renderNav();

  var d = DB.data;
  var company = d.settings.companyName;
  document.getElementById('brandTitle').textContent = company || '評価制度・組織運営';
  document.getElementById('brandSub').textContent = company ? '組織運営アプリ' : 'チームで使う運用アプリ';
  var mark = document.getElementById('brandMark');
  if(mark) mark.textContent = company ? company.replace(/^(株式会社|有限会社|合同会社)/,'').charAt(0) : '評';

  document.getElementById('topTitle').textContent = v.title;
  document.getElementById('topDesc').textContent = v.desc || '';

  var pd = projectDay();
  var r = readinessScore();
  document.getElementById('topMeta').innerHTML =
    (pd.day>0 ? '<span class="badge accent">Week '+pd.week+'／'+pd.day+'日目</span> ' : '')+
    '<span class="badge '+(r.total>=80?'ok':r.total>=50?'warn':'bad')+'" title="社員台帳・目標・KPI・1on1・評価・報告の記入が、どれだけ埋まっているか">記録の充実度 '+r.total+'%</span> '+
    '<span id="syncBadge">'+(typeof syncStatusHtml==='function'?syncStatusHtml():'')+'</span>';

  var foot = document.getElementById('sideFoot');
  if(foot){
    var mode = (typeof SYNC !== 'undefined') ? SYNC.cfg.mode : 'local';
    foot.innerHTML = mode === 'folder'
      ? '会社の共有フォルダと同期しています。<br>週に1回はバックアップも保存してください。'
      : mode === 'server'
      ? '共有サーバーと同期しています。<br>週に1回はバックアップも保存してください。'
      : 'データはこのPCのブラウザ内に保存されます。<br>定期的にバックアップを保存してください。';
  }

  var view = document.getElementById('view');
  view.innerHTML = v.render();
  view.scrollTop = 0;
  window.scrollTo(0,0);
  document.title = v.title + '｜' + (company ? company+' ' : '') + '組織運営アプリ';
}

action('go', function(ds){
  if(!VIEWS[ds.view]) return;
  if(ds.tab && VIEWS[ds.view].setTab) VIEWS[ds.view].setTab(ds.tab);
  currentView = ds.view;
  closeAllModals();
  try{ location.hash = '#'+ds.view; }catch(e){}
  render();
  var vw = document.getElementById('view');
  if(vw && typeof vw.focus === 'function') vw.focus({preventScroll:true});
});



window.addEventListener('hashchange', function(){
  var v = location.hash.replace('#','');
  if(v && VIEWS[v] && v !== currentView){ currentView = v; render(); }
});

action('printView', function(){ window.print(); });

/* ---------- 画面の明るさ（明るい配色／暗い配色） ---------- */
var THEME_KEY = 'hyokaSeido_theme';
function themeGet(){
  try{ return localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){ return 'auto'; }
}
function themeApply(t){
  var root = document.documentElement;
  if(root && root.setAttribute){
    if(t === 'auto'){ if(root.removeAttribute) root.removeAttribute('data-theme'); }
    else root.setAttribute('data-theme', t);
  }
  var b = document.getElementById('themeBtn');
  if(b){
    b.innerHTML = t === 'dark' ? ic('sparkle',15) : t === 'light' ? ic('monitor',15) : ic('cloud',15);
    b.title = t === 'dark' ? '暗い配色（クリックで自動に戻す）'
            : t === 'light' ? '明るい配色（クリックで暗い配色へ）'
            : 'パソコンの設定に合わせる（クリックで明るい配色へ）';
  }
}
action('toggleTheme', function(){
  var order = ['auto','light','dark'];
  var next = order[(order.indexOf(themeGet())+1) % 3];
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  themeApply(next);
  toast(next==='dark'?'暗い配色にしました':next==='light'?'明るい配色にしました':'パソコンの設定に合わせます');
});

/* ---------- 起動 ---------- */
function boot(){
  themeApply(themeGet());
  if(typeof syncLoadCfg === 'function') syncLoadCfg();
  DB.load();
  var v = location.hash.replace('#','');
  if(v && VIEWS[v]) currentView = v;
  else if(!DB.data.employees.length) currentView = 'dashboard';
  render();
  if(typeof syncInit === 'function') syncInit();

  /* 未保存のまま閉じる事故を防ぐため、変更のたびに保存している旨をログに残す */
  console.log('%c'+APP_NAME+' v'+APP_VERSION,
    'font-weight:bold;color:var(--brand);',
    '\nデータはこのブラウザ内（localStorage）に保存されます。定期的に「設定・データ」からバックアップを保存してください。');
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
