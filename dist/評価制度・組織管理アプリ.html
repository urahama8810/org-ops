    add('bad','期限を過ぎた対策が'+overdue.length+'件',
        overdue.slice(0,3).map(function(o){
          return o.ind+'（'+(o.owner?empName(o.owner):'担当未定')+'・'+o.due+'）'; }).join(' / '),'kpi',overdue.length);

  /* --- 1on1（第9章） --- */
  var oo = oneOnOneRate();
  if(oo.total && oo.missing.length){
    var lvl = projectDay().week >= 4 ? 'warn' : 'warn';
    add(lvl,'今月の1on1がまだの人が'+oo.missing.length+'名',
        oo.missing.slice(0,6).map(function(e){return e.name;}).join('、')+(oo.missing.length>6?' ほか':''),'oneonone',oo.missing.length);
  }
  /* 約束の未確認 */
  var openPromises = 0;
  d.oneOnOnes.forEach(function(o){ (o.promises||[]).forEach(function(p){ if(!p.done) openPromises++; }); });
  if(openPromises >= 5)
    add('warn','未完了の「翌月の約束」が'+openPromises+'件','次回1on1で必ず結果を確認します。','oneonone',openPromises);

  /* --- 報告ルール（第8章） --- */
  var rc = reportCompliance();
  if(rc.late.length)
    add('bad','報告期限を守れなかった案件が'+rc.late.length+'件',
        '報告が遅れる原因（言いにくい・忘れる・判断に迷う）を1on1で扱ってください。','reports',rc.late.length,'log');
  var pending = d.reports.filter(function(r){ return r.needApproval && !r.approvedAt && r.status!=='rejected'; });
  if(pending.length)
    add('warn','承認待ちが'+pending.length+'件','承認が滞ると現場が止まります。','reports',pending.length,'approval');

  /* --- 評価（第10・12章） --- */
  var period = d.settings.currentPeriod;
  var evs = d.evaluations.filter(function(e){ return e.period === period; });
  if(d.employees.length && projectDay().week >= 8 && !evs.length)
    add('warn','今期（'+period+'）の評価が未着手','Week 8〜12で初回試験評価を行います。','evaluations');
  var stuck = evs.filter(function(e){ return e.stage !== 'explained'; });
  if(evs.length && stuck.length)
    add('warn','評価が未完了の社員が'+stuck.length+'名','本人説明まで完了して1サイクルです。','evaluations',stuck.length);

  /* --- 改善計画（第13章） --- */
  d.employees.forEach(function(e){
    if(needsImprovementPlan(e.id) && !hasActivePlan(e.id))
      add('bad','【'+e.name+'】改善計画が必要','評価1、または評価2が継続しています。30〜60日の改善計画を作成してください。','improvement');
  });

  /* --- 等級 --- */
  var noGrade = d.employees.filter(function(e){ return !e.grade; });
  if(noGrade.length && projectDay().week >= 6)
    add('warn','等級が未設定の社員が'+noGrade.length+'名','G1〜G5への仮格付けを行います。','grades',noGrade.length);

  /* ============================================================
     ここから下は、決め方・任せ方・お金の使い方についての判定
     ============================================================ */

  /* --- 重要な決定（24時間おいてから確定する） --- */
  var readyDec = d.decisions.filter(function(x){
    return (x.stage==='holding'||x.stage==='draft') && hoursLeft(holdUntil(x, 24)) <= 0;
  });
  if(readyDec.length)
    add('warn','待ち時間が明けた決定が'+readyDec.length+'件',
        readyDec.slice(0,3).map(function(x){return x.title;}).join('／')+' — 24時間が過ぎました。確定するか見送るかを決めてください。','decisions',readyDec.length);

  var noDevil = d.decisions.filter(function(x){
    return x.stage!=='decided' && x.stage!=='dropped' && (!x.devilName || !String(x.devilNote||'').trim());
  });
  if(noDevil.length)
    add('warn','反対意見の確認が済んでいない決定が'+noDevil.length+'件',
        '大きな決定には、反対の立場から意見を言う人を1名置きます。反論が出ないときは、納得ではなく言いにくいだけかもしれません。','decisions',noDevil.length);

  var forced = d.decisions.filter(function(x){ return x.stage==='decided' && x.heldOk===false; });
  if(forced.length >= 2)
    add('warn','待ち時間をおかずに確定した決定が'+forced.length+'件',
        '急ぎの事情が続いているのかもしれません。手順のほうに無理がないか、一度見直してみてください。','decisions',forced.length);

  var readyVen = d.ventures.filter(function(v){
    return (!v.stage||v.stage==='draft') && hoursLeft(holdUntil(v, 48)) <= 0;
  });
  if(readyVen.length)
    add('warn','判断待ちの新しい取り組みが'+readyVen.length+'件',
        '48時間が過ぎました。企画書を見て、始めるか見送るかを決めてください。','decisions',readyVen.length);

  var noExit = d.ventures.filter(function(v){
    return (v.stage==='approved'||v.stage==='running') && !String(v.exitCond||'').trim();
  });
  if(noExit.length)
    add('bad','撤退の条件が決まっていない取り組みが'+noExit.length+'件',
        'いつ・何を見てやめるかは、始める前に決めておきます。あとからでは決めにくくなります。','decisions',noExit.length);

  /* --- 任せた仕事（6項目と中間確認） --- */
  var openDlg = d.delegations.filter(function(x){ return !x.state || x.state==='open'; });
  var noCheck = openDlg.filter(function(x){ return !nextCheckDate(x); });
  if(noCheck.length)
    add('bad','途中の確認日が決まっていない仕事が'+noCheck.length+'件',
        noCheck.slice(0,3).map(function(x){return x.title;}).join('／')+' — 確認日がないと、状況が見えないまま期限を迎えがちです。','delegation',noCheck.length);

  var lateCheck = openDlg.filter(function(x){
    var nc = nextCheckDate(x); return nc && nc < todayStr();
  });
  if(lateCheck.length)
    add('bad','中間確認の期日を過ぎた委任が'+lateCheck.length+'件',
        '問題を小さいうちに見つける機会です。遅れるほど、発覚時の損失が大きくなります。','delegation',lateCheck.length);

  var todayCheck = openDlg.filter(function(x){ return nextCheckDate(x) === todayStr(); });
  if(todayCheck.length)
    add('warn','今日が中間確認日の委任が'+todayCheck.length+'件',
        todayCheck.map(function(x){return x.title;}).join('／'),'delegation',todayCheck.length);

  var thinDlg = openDlg.filter(function(x){ return delegationFill(x).rate < 100; });
  if(thinDlg.length)
    add('warn','6項目が埋まっていない委任が'+thinDlg.length+'件',
        '成果・期限・裁量・禁止事項・中間確認・相談条件のどれかが空欄です。','delegation',thinDlg.length);

  /* --- 人材の定着（第7章 逆選抜） --- */
  var noPath = d.employees.filter(function(e){
    return !e.isTop && !String(e.nextRole||'').trim() && !String(e.growthTalkAt||'').trim();
  });
  if(noPath.length && d.employees.length >= 3)
    add('warn','これからの役割をまだ話せていない人が'+noPath.length+'名',
        '半年後・1年後に何を任せたいかを伝えると、次に何を伸ばせばよいかが見えます。1on1で話す内容の候補です。',
        'employees',noPath.length);

  /* --- ガバナンス（第11章 第4層） --- */
  var noContract = d.partners.filter(function(p){ return !p.contractDone; });
  if(noContract.length)
    add('bad','契約・合意が文書化されていない関係者が'+noContract.length+'件',
        noContract.map(function(p){return p.name;}).join('、')+
        ' — 信頼できる相手だから契約が要らないのではなく、信頼を長く保つために契約します。','capital',noContract.length,'partner');

  var noInterest = d.partners.filter(function(p){ return !String(p.interest||'').trim(); });
  if(noInterest.length)
    add('warn','相手の利害を書けていない関係者が'+noInterest.length+'件',
        'ここを書けない相手とは、必ずどこかで期待値がずれます。','capital',noInterest.length,'partner');

  var dueCheck = d.partners.filter(function(p){ return p.nextCheck && p.nextCheck < todayStr(); });
  if(dueCheck.length)
    add('warn','定期確認の期日を過ぎた関係者が'+dueCheck.length+'件',
        dueCheck.map(function(p){return p.name;}).join('、'),'capital',dueCheck.length,'partner');

  /* --- 資本配分（第11章 第4層） --- */
  var capRule = (d.capital && d.capital.rule) || {};
  var capPeriod = currentCapPeriod();
  if(capPeriod){
    var cs = capitalSummary(capPeriod);
    if(cs.rate !== null && cs.rate < num(capRule.reinvestRate,50))
      add('warn','再投資率が目標を下回っています（'+cs.rate+'% ／ 目標'+num(capRule.reinvestRate,50)+'%）',
          '利益を人材・営業・商品・仕組みへ戻さないと、組織能力の複利が止まります。','capital');
    if(num(capRule.nonBizCap,0) > 0 && cs.nonbiz > num(capRule.nonBizCap,0))
      add('bad','事業と関係ない支出が年間上限を超えています',
          yen(cs.nonbiz)+'円 ／ 上限 '+yen(capRule.nonBizCap)+'円','capital');
  }

  /* --- 診断の上流指標 --- */
  var dq = diagnosisSummary();
  dq.upstreamNo.forEach(function(it){
    add('bad','上流指標の警告：'+it.q,
        'この項目は、他の多くの問題へ波及します。ここから先に手を付けてください。','diagnosis');
  });

  /* --- 報酬連動の注意（第12章・注意書き） --- */
  if(d.settings.payLinked && !d.settings.laborCheckDone)
    add('bad','報酬連動を有効にしていますが、就業規則等の確認が未完了です',
        '減給・賞与・降格への連動前に、就業規則・賃金規程との整合を社労士等へ確認してください。','settings');

  var order = { bad:0, warn:1 };
  return a.sort(function(x,y){ return order[x.level]-order[y.level]; });
}

/* ダッシュボードの「導入完成度」 */
function readinessScore(){
  var d = DB.data, parts = [];
  /* 1) 台帳の完成度 */
  var lg = d.employees.length ?
    Math.round(d.employees.reduce(function(s,e){ return s+ledgerStatus(e).rate; },0)/d.employees.length) : 0;
  parts.push({ key:'ledger', label:'社員・役割台帳', rate:lg, view:'employees' });
  /* 2) 目標 */
  var comp = d.goals.filter(function(g){ return g.level==='company'; });
  var gRate = 0;
  if(comp.length){
    var full = comp.filter(function(g){ return g.metric && g.target90!=='' && g.owner && g.dataSource; }).length;
    gRate = Math.round(full/comp.length*100 * clamp(comp.length/3,0,1));
  }
  parts.push({ key:'goals', label:'会社・部門目標', rate:gRate, view:'goals' });
  /* 3) 役割表 */
  var scRate = clamp(Math.round(d.scorecards.length/6*100),0,100);
  parts.push({ key:'scorecards', label:'職種別役割表', rate:scRate, view:'scorecards' });
  /* 4) 週次KPI（直近4週の実施率） */
  var weeks = 0, mon = weekMonday();
  for(var i=0;i<4;i++){
    var target = fmtDate(new Date(new Date(mon).getTime() - i*7*86400000));
    if(d.kpiWeeks.some(function(w){ return w.weekOf === target; })) weeks++;
  }
  parts.push({ key:'kpi', label:'週次KPI会議', rate:Math.round(weeks/4*100), view:'kpi' });
  /* 5) 1on1 */
  parts.push({ key:'oneonone', label:'月次1on1', rate:oneOnOneRate().rate, view:'oneonone' });
  /* 6) 評価 */
  var period = d.settings.currentPeriod;
  var evs = d.evaluations.filter(function(e){ return e.period===period; });
  var eRate = d.employees.length ? Math.round(evs.filter(function(e){ return e.stage==='explained'; }).length/d.employees.length*100) : 0;
  parts.push({ key:'evaluations', label:'評価（当期）', rate:eRate, view:'evaluations' });
  /* 7) 等級 */
  var gr = d.employees.length ? Math.round(d.employees.filter(function(e){return !!e.grade;}).length/d.employees.length*100) : 0;
  parts.push({ key:'grades', label:'等級格付け', rate:gr, view:'grades' });
  /* 8) 報告ルール（記録が1件もない場合は「未評価」として平均から除外する） */
  var rc = reportCompliance();
  parts.push({ key:'reports', label:'報告・承認の遵守', rate:rc.total?rc.rate:0, na:!rc.total, view:'reports' });

  var counted = parts.filter(function(p){ return !p.na; });
  var total = counted.length ? Math.round(counted.reduce(function(s,p){ return s+p.rate; },0)/counted.length) : 0;
  return { total:total, parts:parts };
}

        '<b>ようこそ。</b> このアプリは、役割・目標・数字・報告のルールを1か所にまとめて、'+
        'チーム全員が同じ情報を見ながら会社を動かすための道具です。'+
        'まず <b>設定</b> で会社名を入れ、次に <b>社員・役割台帳</b> にメンバーを登録してください。'+
        '<div class="btn-row" style="margin-top:9px;">'+
        '<button class="btn primary" data-act="go" data-view="settings">'+ic('settings',14)+'① 設定を開く</button>'+
        '<button class="btn" data-act="go" data-view="employees">'+ic('users',14)+'② メンバーを登録する</button>'+
        '<button class="btn" data-act="loadDemo">'+ic('sparkle',14)+'操作を試す（サンプルデータを入れる）</button>'+
        '<a class="btn" href="'+GUIDE_URL+'" target="_blank" rel="noopener">'+ic('play',14)+'使い方の動画を見る（約17分）</a>'+
        '</div></div>';
    }

    /* --- 上段タイル --- */
    var badCount = alerts.filter(function(a){return a.level==='bad';}).length;
    h += '<div class="section-title">いまの状態</div>';
    h += '<div class="grid c4">'+
      tile('台帳と記録の充実度', r.total+'<small>%</small>',
           progressBar(r.total, r.total>=80?'ok':r.total>=50?'warn':'bad'),
           r.total>=80?'ok':r.total>=50?'warn':'bad', 'clipboard')+
      tile('導入からの経過', pd.day>0? pd.day+'<small>日目</small>' : '<small>未開始</small>',
           pd.day>0 ? ('Week '+pd.week+' / 90日中 残り'+Math.max(0,90-pd.day)+'日') : '設定で開始日を入力',
           'accent', 'calendar')+
      tile('導入の進み具合', pp.rate+'<small>%</small>',
           pp.done+' / '+pp.total+' 項目'+
           '<div class="foot">'+btn('導入の段取りを見る','go',{view:'plan'},'','arrowRight')+'</div>',
           pp.rate>=80?'ok':pp.rate>=40?'warn':'bad', 'route')+
      tile('いま手を打つこと', badCount+'<small>件</small>',
           'あわせて確認 '+alerts.filter(function(a){return a.level==='warn';}).length+'件',
           badCount? 'bad':'ok', 'alert')+
      '</div>';

    /* --- 対応すること --- */
    h += '<div class="section-title">気づいたこと'+
         '<span class="note">上から順に片づけていけば大丈夫です</span></div>';

    var parts = '<table class="tbl"><tbody>';
    r.parts.forEach(function(p){
      parts += '<tr><td style="width:150px;">'+esc(p.label)+'</td>'+
        '<td>'+(p.na ? '<span class="small muted">まだ記録がありません</span>'
                     : progressBar(p.rate, p.rate>=80?'ok':p.rate>=40?'warn':'bad'))+'</td>'+
        '<td class="num mono" style="width:52px;">'+(p.na?'—':p.rate+'%')+'</td>'+
        '<td class="actions" style="width:70px;">'+btn('開く','go',{view:p.view})+'</td></tr>';
    });
    parts += '</tbody></table>';

    h += '<div class="grid c21">'+
      '<div class="col">'+
        card('いま気になっていること', renderAlerts(alerts), {
          icon:'alert',
          sub: alerts.length ? alerts.length+'件' : '気になる点はありません' })+
      '</div>'+
      '<div class="col">'+
        renderTodayFocus()+
        card('6つの記録の埋まり具合', parts, {icon:'clipboard', tight:true})+
        renderRecentActivity()+
      '</div>'+
    '</div>';

    /* --- 正の循環（先行指標） --- */
    h += '<div class="section-title">良い流れの手ごたえ'+
         '<span class="note">売上より先に動く6つの数字</span></div>';
    h += renderCycleSnapshot();

    /* --- 今週の会議・1on1 --- */
    h += '<div class="section-title">今週と今月</div>';
    /* カード1枚ずつなので、グリッドに直接置いて高さをそろえる */
    h += '<div class="grid c2">'+ renderWeeklySnapshot() + renderPeopleSnapshot() +'</div>';

    return h;
  }
};

function renderAlerts(alerts){
  if(!alerts.length){
    return '<div class="alert ok"><span class="ic">'+ic('check',15)+'</span>'+
           '<div class="body"><div class="t">いま気になる点はありません</div>'+
           '<div class="d">この状態を保ちましょう。週次KPI会議と月次1on1の記録を続けてください。</div></div></div>';
  }
  var h = '';
  alerts.slice(0,10).forEach(function(a){
    h += '<div class="alert '+a.level+'">'+
      '<span class="ic">'+ic(a.level==='bad'?'alert':'info',15)+'</span>'+
      '<div class="body"><div class="t">'+esc(a.title)+'</div>'+
      '<div class="d">'+esc(a.detail)+'</div></div>'+
      '<div class="go">'+btn('開く','go',a.tab?{view:a.view,tab:a.tab}:{view:a.view},'','arrowRight')+'</div></div>';
  });
  if(alerts.length > 10)
    h += '<div class="small muted center" style="padding-top:6px;">'+
         'ほか '+(alerts.length-10)+'件。上から順に片づけると、下の項目も一緒に消えていきます。</div>';
  return h;
}

/* 今日の焦点：着手順（第15章）の未完了の先頭 */
function renderTodayFocus(){
  var fs = DB.data.firstSteps || {};
  var next = -1;
  for(var i=0;i<FIRST_STEPS.length;i++){ if(!fs[i]){ next = i; break; } }
  var body;
  if(next < 0){
    body = '<div class="alert ok"><span class="ic">'+ic('check',15)+'</span>'+
           '<div class="body"><div class="t">最初の10項目はすべて完了しています</div>'+
           '<div class="d">ここからは運用です。週次KPI・月次1on1・四半期評価を続けてください。</div></div></div>';
  }else{
    body = '<div class="small muted" style="margin-bottom:4px;">次にやること</div>'+
      '<div class="headline" style="font-size:var(--fs-lg);">'+(next+1)+'. '+esc(FIRST_STEPS[next])+'</div>'+
      '<div class="btn-row" style="margin-top:10px;">'+
        '<button class="btn primary" data-act="doneFirstStep" data-i="'+next+'">完了にする</button>'+

      '</div>';

  return card('次の一手', body, {icon:'route', sub:FIRST_STEPS.length+'ステップ中 '+doneN+'つ完了'});
}

/* 最近の動き（誰が何を記録したかを、日付順に並べる） */
function renderRecentActivity(){
  var d = DB.data, items = [];
  function add(when, what, view){
    if(when) items.push({ when:String(when), what:what, view:view });
  }
  d.reports.forEach(function(r){ add(r.reportedAt||r.requestedAt, '報告：'+r.title, 'reports'); });
  d.incidents.forEach(function(r){ add(r.date, '問題処理：'+r.title, 'reports'); });
  d.oneOnOnes.forEach(function(o){ add(o.date, '1on1：'+empName(o.employeeId), 'oneonone'); });
  d.kpiWeeks.forEach(function(w){ add(w.weekOf, '週次KPI会議（'+w.weekOf+'の週）', 'kpi'); });
  d.evaluations.forEach(function(e){ if(e.stage==='explained') add(e.createdAt, '評価の説明完了：'+empName(e.employeeId), 'evaluations'); });
  d.decisions.forEach(function(x){ add(x.decidedAt||x.raisedAt, '重要な決定：'+x.title, 'decisions'); });
  d.ventures.forEach(function(x){ add(x.decidedAt||x.raisedAt, '新規案件：'+x.title, 'decisions'); });
  d.delegations.forEach(function(x){
    add(x.startDate, '委任：'+x.title, 'delegation');
    (x.checks||[]).forEach(function(c){ if(c.doneAt) add(c.doneAt, '中間確認：'+x.title, 'delegation'); });
  });
  d.partners.forEach(function(x){ if(x.lastCheck) add(x.lastCheck, '関係者の定期確認：'+x.name, 'capital'); });
  ((d.capital||{}).spends||[]).forEach(function(x){ add(x.date, '支出：'+x.title, 'capital'); });
  d.improvementPlans.forEach(function(x){ add(x.startDate, '改善計画：'+empName(x.employeeId), 'improvement'); });

  items = sortBy(items, function(i){ return i.when; }).reverse().slice(0,8);

  if(!items.length) return '';        /* 何も記録がないうちは出さない */

  var body = '<table class="tbl"><tbody>'+items.map(function(i){
    return '<tr><td class="small muted nowrap" style="width:52px;">'+esc(shortDate(i.when))+'</td>'+
           '<td class="small">'+esc(i.what)+'</td>'+
           '<td class="actions" style="width:56px;">'+btn('開く','go',{view:i.view})+'</td></tr>';
  }).join('')+'</tbody></table>';

  return card('最近の動き', body, { tight:true, sub:'新しい順' });
}

/* ============================================================
   04b-me.js  わたしの画面
   ------------------------------------------------------------
   自分に関係するものだけを集めた画面。
   全社の数字ではなく、「自分は今週なにをすればいいか」が分かる場所。

   誰としてこのアプリを見るかは、このパソコンごとに覚える。
   （共有データには入れないので、他の人には見えない）
   ============================================================ */

var ME_KEY = 'hyokaSeido_me';

/* 今日からn日後の日付（YYYY-MM-DD） */
function meDayOff(n){ return fmtDate(new Date(Date.now() + n*86400000)); }

function myEmpId(){
  try{ return localStorage.getItem(ME_KEY) || ''; }catch(e){ return ''; }
}
function setMyEmpId(id){
  try{ id ? localStorage.setItem(ME_KEY, id) : localStorage.removeItem(ME_KEY); }catch(e){}
}
function me(){
  var id = myEmpId();
  return id ? byId(DB.data.employees, id) : null;
}

/* 自分が責任者になっている、直近の週のKPI行 */
function myKpiRows(){
  var id = myEmpId();
  if(!id || !DB.data.kpiWeeks.length) return { week:null, rows:[] };
  var w = latestKpiWeek();
  if(!w) return { week:null, rows:[] };
  return { week:w, rows:(w.rows||[]).filter(function(r){ return r.owner === id; }) };
}

/* 自分あての対策で、期限が来ているもの（今週の分だけでなく全週から） */
function myOpenActions(){
  var id = myEmpId(), out = [];
  if(!id) return out;
  DB.data.kpiWeeks.forEach(function(w){
    (w.rows||[]).forEach(function(r){
      if(r.owner !== id) return;
      if(!String(r.action||'').trim() || r.doneAt) return;
      out.push({ week:w.weekOf, ind:r.indicator, action:r.action, due:r.due||'' });
    });
  });
  return sortBy(out, function(x){ return x.due || '9999'; });
}

/* 自分が任されている仕事 */
function myDelegations(){
  var id = myEmpId();
  if(!id) return [];
  return DB.data.delegations.filter(function(x){
    return x.employeeId === id && (!x.state || x.state === 'open');
  });
}

/* 今月の1on1と、前回までの未完了の約束 */
function myOneOnOne(){
  var id = myEmpId();
  if(!id) return { thisMonth:null, promises:[] };
  var mine = sortBy(DB.data.oneOnOnes.filter(function(o){ return o.employeeId === id; }),
                    function(o){ return o.month; });
  var thisMonth = mine.filter(function(o){ return o.month === monthStr(); })[0] || null;
  var promises = [];
  mine.forEach(function(o){
    (o.promises||[]).forEach(function(p){ if(!p.done) promises.push({ text:p.text, month:o.month }); });
  });
  return { thisMonth:thisMonth, promises:promises, all:mine };
}

VIEWS.me = {
  title:'わたしの画面',
  desc:'自分に関係するものだけを集めました。まずここを見てください。',

    var m = me();
    if(!m) return renderMePicker();

    var h = '';
    var acts = myOpenActions();
    var dlgs = myDelegations();
    var ooo  = myOneOnOne();
    var kw   = myKpiRows();
    var late = acts.filter(function(a){ return a.due && a.due < todayStr(); });
    var checkSoon = dlgs.filter(function(x){
      var nc = nextCheckDate(x); return nc && nc <= meDayOff(3);
    });

    /* --- あいさつと、今週の要点 --- */
    h += '<div class="me-head">'+
      '<div class="me-who">'+
        '<div class="me-avatar">'+esc(m.name.charAt(0))+'</div>'+
        '<div><div class="me-name">'+esc(m.name)+'</div>'+
        '<div class="small muted">'+esc([m.dept, m.roleTitle, m.grade].filter(Boolean).join('　/　'))+'</div></div>'+
      '</div>'+
      '<span class="spacer"></span>'+
      btn('自分を選び直す','mePick',{},'ghost','users')+
      '</div>';

    /* --- 今週やること --- */
    var todo = [];
    if(late.length) todo.push({ lv:'bad', t:'期限が過ぎた対策が'+late.length+'件', d:late.map(function(a){return a.ind;}).slice(0,3).join('／'), view:'kpi' });
    if(checkSoon.length) todo.push({ lv:'warn', t:'まもなく途中確認の日です（'+checkSoon.length+'件）', d:checkSoon.map(function(x){return x.title;}).slice(0,3).join('／'), view:'delegation' });
    if(!ooo.thisMonth) todo.push({ lv:'warn', t:'今月の1on1がまだです', d:'上司と日程を決めてください。', view:'oneonone' });
    if(ooo.promises.length) todo.push({ lv:'warn', t:'前回の1on1で決めたことが'+ooo.promises.length+'件、まだ完了していません', d:ooo.promises.slice(0,2).map(function(p){return p.text;}).join('／'), view:'oneonone' });

    var todoBody = todo.length
      ? todo.map(function(x){
          return '<div class="alert '+x.lv+'"><span class="ic">'+ic(x.lv==='bad'?'alert':'info',15)+'</span>'+
                 '<div class="body"><div class="t">'+esc(x.t)+'</div>'+
                 (x.d?'<div class="d">'+esc(x.d)+'</div>':'')+'</div>'+
                 '<div class="go">'+btn('開く','go',{view:x.view},'','arrowRight')+'</div></div>';
        }).join('')
      : '<div class="alert ok"><span class="ic">'+ic('check',15)+'</span><div class="body">'+
        '<div class="t">いま急ぎの用件はありません</div>'+
        '<div class="d">週次KPIの数字を入れて、任されている仕事を進めましょう。</div></div></div>';

    h += '<div class="section-title">今週やること</div>';
    h += card(null, todoBody, {});

    /* --- 数字・仕事・面談 --- */
    h += '<div class="section-title">わたしの数字と仕事</div>';
    h += '<div class="grid c2">';

    /* 自分のKPI */
    var kpiBody;
    if(!kw.week){
      kpiBody = '<div class="empty">'+ic('trending',26)+'<div class="big">週次KPIがまだありません</div>'+
                '<div>週次KPI会議の記録が作られると、ここに自分の担当分が出ます。</div></div>';
    }else if(!kw.rows.length){
      kpiBody = '<div class="empty">'+ic('trending',26)+'<div class="big">担当している指標はありません</div>'+
                '<div>週次KPI表で自分が責任者になっている指標が、ここに出ます。</div></div>';
    }else{
      kpiBody = tableHtml([
        { label:'指標', render:function(r){ return '<b>'+esc(r.indicator)+'</b>'; } },
        { label:'目標', cls:'num', width:'80px', render:function(r){ return esc(r.target); } },
        { label:'実績', cls:'num', width:'80px', render:function(r){ return r.actual===''||r.actual===undefined ? '<span class="muted">未入力</span>' : esc(r.actual); } },
        { label:'状態', width:'92px', render:function(r){
            var st = kpiRowStatus(r);
            var k = KPI_STATUS.filter(function(x){ return x.key===st; })[0];
            return badge(k.label, k.cls); } }
      ], kw.rows, {});
    }
    h += card('今週のKPI', kpiBody, {
      icon:'trending', sub: kw.week ? kw.week.weekOf+' の週' : '',
      tools: btn('KPI会議を開く','go',{view:'kpi'},'','arrowRight') });

    /* 任されている仕事 */
    var dlgBody = dlgs.length ? tableHtml([
      { label:'仕事', render:function(r){
          return '<b>'+esc(r.title)+'</b>'+(r.outcome?'<div class="small muted">'+esc(String(r.outcome).slice(0,60))+'</div>':''); } },
      { label:'期限', width:'104px', render:function(r){ return r.due ? esc(r.due) : '<span class="muted">—</span>'; } },
      { label:'次の確認', width:'116px', render:function(r){
          var nc = nextCheckDate(r);
          if(!nc) return badge('未設定','warn');
          var left = daysBetween(todayStr(), nc);
          return esc(nc)+'<div class="small '+(left<0?'':'muted')+'"'+(left<0?' style="color:var(--bad-solid);font-weight:600;"':'')+'>'+
                 (left<0?(-left)+'日超過':left===0?'今日':'あと'+left+'日')+'</div>'; } }
    ], dlgs, {}) : '<div class="empty">'+ic('handoff',26)+'<div class="big">いま任されている仕事はありません</div>'+
      '<div>上司から仕事を渡されると、ここに出ます。</div></div>';
    h += card('任されている仕事', dlgBody, {
      icon:'handoff', sub: dlgs.length ? dlgs.length+'件' : '',
      tools: btn('一覧を開く','go',{view:'delegation'},'','arrowRight') });

    h += '</div>';

    /* --- 自分の役割 --- */
    h += '<div class="section-title">わたしの役割<span class="note">迷ったらここに戻ってきてください</span></div>';
    function row(k, v){
      /* nl2br() は中で esc() しているので、ここで重ねてはいけない（&lt; がそのまま表示されてしまう） */
      return '<dt>'+esc(k)+'</dt><dd>'+(String(v||'').trim() ? nl2br(v) : '<span class="muted">未記入</span>')+'</dd>';
    }
    h += '<div class="grid c2">'+
      card('担当していること',
        '<dl class="kv">'+
        row('役割', m.roleTitle)+
        row('主な仕事', lines(m.mainDuties).join('\n'))+
        row('成果物', m.deliverables)+
        row('KPI', lines(m.kpis).join('\n'))+
        row('目標値', m.kpiTarget)+
        '</dl>', {icon:'clipboard'})+
      card('決めてよいこと・確認すること',
        '<dl class="kv">'+
        row('自分で決めてよいこと', m.authority)+
        row('承認をもらう必要があること', m.approvals)+
        row('直属の上司', m.manager ? empName(m.manager) : '')+
        row('困ったときの相談先', m.manager ? empName(m.manager) : '')+
        row('これから任せたい役割', m.nextRole)+
        '</dl>', {icon:'shield'})+
      '</div>';

    /* --- 1on1の履歴 --- */
    if(ooo.all && ooo.all.length){
      var last = ooo.all.slice(-3).reverse();
      h += '<div class="section-title">これまでの1on1</div>';
      h += card(null, tableHtml([
        { label:'月', width:'96px', render:function(o){ return esc(o.month); } },
        { label:'話したこと', render:function(o){ return '<span class="small">'+esc(String(o.wins||o.feedback||o.kpiReview||'').slice(0,80))+'</span>'; } },
        { label:'決めたこと', render:function(o){
            var ps = o.promises||[];
            return ps.length ? '<span class="small">'+ps.map(function(p){
              return (p.done?'✓ ':'□ ')+esc(p.text); }).join('<br>')+'</span>' : '<span class="muted small">—</span>'; } }
      ], last, {}), {tight:true});
    }

    return h;
  }
};

var empFilter = { dept:'', q:'', onlyIncomplete:false };

/* 追加のときに、これだけは入れてほしい7項目。
   ここが埋まっていれば、目標もKPIも1on1も回りはじめる。 */
var EMP_CORE_KEYS = ['name','dept','manager','roleTitle','deliverables','kpis','approvals'];

/* coreOnly = true なら、追加用の7項目だけを返す */
function employeeFields(coreOnly){
  var all = employeeAllFields();
  if(!coreOnly) return all;
  var out = [];
  EMP_CORE_KEYS.forEach(function(k){
    for(var i=0;i<all.length;i++) if(all[i].key === k){ out.push(all[i]); break; }
  });
  return out;
}

function employeeAllFields(){
  return [
    { type:'heading', label:'基本' },
    { key:'name',      label:'氏名', required:true },
    { key:'dept',      label:'部署', hint:'例：営業部／管理部' },
    { key:'empType',   label:'雇用形態', type:'select', options:[''].concat(EMPLOYMENT_TYPES) },
    { key:'joinDate',  label:'入社日', type:'date' },
    { key:'jobType',   label:'職種区分', type:'select', options:[''].concat(jobTypeList()),
      hint:'職種別役割表と紐づきます。' },
    { key:'grade',     label:'等級', type:'select', options:[''].concat(DB.data.grades.map(function(g){return g.code;})) },

    { type:'heading', label:'組織' },
    { key:'manager',   label:'直属の上司', type:'select', options:empOptions(true),
      hint:'誰に報告し、誰に相談するのかを決めます。空欄のままにしないでください。' },
    { key:'isTop',     label:'最終責任者（この人に上司はいない）', type:'checkbox' },
    { key:'backup',    label:'引き継ぎ先', hint:'休みや異動のときに、誰が引き継ぐか。', full:true },

    { type:'heading', label:'役割' },
    { key:'roleTitle',    label:'役割', hint:'肩書ではなく、会社の中で担っている役目を書きます。', full:true },
    { key:'mainDuties',   label:'主要業務（3〜5個）', type:'list', rows:5, full:true,
      hint:'1行に1つ。多いときは、重要な5つに絞ります。' },
    { key:'deliverables', label:'成果物', type:'textarea', rows:2, full:true,
      hint:'「何ができていれば、この仕事は終わりか」を書きます。決めにくいときは上司と一緒に決めます。' },

    { type:'heading', label:'数字' },
    { key:'kpis',       label:'KPI', type:'list', rows:4, full:true, hint:'1行に1つ。最大5個。' },
    { key:'kpiTarget',  label:'目標値', type:'textarea', rows:2, full:true, hint:'KPIごとの目標値。例：受注件数 月8件／粗利率 35%以上' },
    { key:'dataSource', label:'実績データの所在', full:true,
      hint:'どのファイル・システムの数字を基準にするか。ここが決まっていないと、数字の解釈で食い違います。' },

    { type:'heading', label:'権限と承認' },
    { key:'authority', label:'本人判断で決めてよいこと', type:'textarea', rows:3, full:true },
    { key:'approvals', label:'承認をもらう必要があること', type:'textarea', rows:3, full:true },

    { type:'heading', label:'これからの役割' },
    { key:'nextRole', label:'半年後・1年後に任せたい役割', type:'textarea', rows:2, full:true,
      hint:'仕事と責任だけが増えて、任される範囲や見通しが変わらないと、次の一歩が見えなくなります。' },
    { key:'growthTalkAt', label:'これからのことを本人と話した日', type:'date',
      hint:'本人の希望と、会社が任せたいことをすり合わせた日を記録します。' },

    { type:'heading', label:'引継ぎ' },
    { key:'handover',    label:'資料・データの保存場所', type:'textarea', rows:2, full:true,
      hint:'個人のパソコンや個人アカウントだけに置かず、共有の場所に保管します。' },
    { key:'replaceable', label:'引き継ぎのしやすさ', type:'select',
      options:['','引き継ぎやすい','引き継ぎ期間が必要','いまは引き継げる人がいない'] },
    { key:'ceoOnlyKnows',label:'この仕事の中身を知っているのが1人だけ', type:'checkbox',
      hint:'本人の評価ではなく、引き継ぎの体制がどうなっているかを表します。' },
    { key:'notes',       label:'備考', type:'textarea', rows:2, full:true }
  ];
}

VIEWS.employees = {

    if(empFilter.q){
      var q = empFilter.q.toLowerCase();

      });

    var h = '';
    h += '<div class="help-block">'+
      '<b>先に埋めたい4項目：</b> 直属の上司／成果物／KPI／この仕事の中身を知っている人が何人いるか。'+
      'この4つは<b>台帳の記入が足りない状態</b>を表すもので、その人の評価ではありません。'+
      '埋まっているほど、引き継ぎも評価もしやすくなります。</div>';

    /* 操作バー */
    var deptOpts = ['<option value="">すべての部署</option>'].concat(deptList().map(function(dp){
      return '<option value="'+esc(dp)+'"'+(empFilter.dept===dp?' selected':'')+'>'+esc(dp)+'</option>';
    })).join('');
    h += '<div class="card"><div class="card-body" style="padding:12px 16px;">'+
      '<div class="inline-form">'+
        '<button class="btn primary" data-act="empNew">＋ 社員を追加</button>'+
        '<select data-change="empDept">'+deptOpts+'</select>'+
        '<input type="text" placeholder="氏名・役割で検索" value="'+esc(empFilter.q)+'" data-change="empSearch" style="min-width:180px;">'+
        '<label class="chk" style="margin:0;"><input type="checkbox" data-change="empIncomplete"'+(empFilter.onlyIncomplete?' checked':'')+'><span>未完成のみ表示</span></label>'+
        '<span style="flex:1"></span>'+
        '<button class="btn" data-act="empCsv">CSVで書き出す</button>'+
        '<button class="btn" data-act="empPrint">印刷</button>'+
      '</div></div></div>';

    /* 一覧 */
    var cols = [
      { label:'氏名', width:'150px', render:function(e){
          return '<b>'+esc(e.name)+'</b>'+(e.isTop?' '+badge('最終責任者','accent'):'')+
                 '<div class="small muted">'+esc(e.dept||'部署未設定')+(e.grade?' / '+esc(e.grade):'')+'</div>'; } },
      { label:'役割・職種', render:function(e){
          return esc(e.roleTitle||'—')+'<div class="small muted">'+esc(e.jobType||'職種未設定')+'</div>'; } },
      { label:'直属上司', width:'120px', render:function(e){
          if(e.isTop) return '<span class="small muted">—</span>';
          return e.manager ? esc(empName(e.manager)) : badge('未確定','bad'); } },
      { label:'部下', width:'54px', cls:'num', render:function(e){
          var n = directReports(e.id).length;
          if(!n) return '<span class="muted">0</span>';
          var over = n > num(DB.data.settings.maxDirectReports,6);
          return '<span class="'+(over?'badge bad':'')+'">'+n+'</span>'; } },
      { label:'成果物', render:function(e){
          return e.deliverables ? '<span class="small">'+esc(e.deliverables).slice(0,50)+'</span>' : badge('未定義','bad'); } },
      { label:'KPI', render:function(e){
          var k = lines(e.kpis);
          if(!k.length) return badge('未設定','bad');
          return '<span class="small">'+esc(k.slice(0,3).join('、'))+(k.length>3?' ほか':'')+'</span>'; } },
      { label:'記入率', width:'120px', render:function(e){
          var st = ledgerStatus(e);
          return progressBar(st.rate, st.rate>=100?'ok':st.rate>=50?'warn':'bad')+
            '<span class="small mono">'+st.done+'/'+st.total+'</span>'+
            (st.missing.length?'<div class="small muted" title="'+esc(st.missing.join('、'))+'">不足：'+esc(st.missing.slice(0,2).join('、'))+(st.missing.length>2?'…':'')+'</div>':''); } },
      { label:'', cls:'actions', width:'150px', render:function(e){

                 btn('削除','empDel',{id:e.id},'danger'); } }

        {label:'知っている人が1人', render:function(e){ return e.ceoOnlyKnows ? badge('該当','warn') : '<span class="muted">—</span>'; }},
        {label:'', cls:'actions', render:function(e){ return btn('編集','empEdit',{id:e.id}); }}
      ], risk, {}), { tight:true });
    }
    return h;
  }
};

/* ---------- 操作 ---------- */
action('empNew', function(){
  openForm({
    title:'メンバーを追加', wide:true, fields:employeeFields(true), value:{},
    intro:'<b>まずはこの7項目だけで大丈夫です。</b>'+
          '残りの項目（雇用形態・等級・引き継ぎ先など）は、あとから詳細画面で足せます。'+
          '分からないところは、本人や直属の上司に確認しながら埋めていきましょう。',
    submitLabel:'追加する',
    onSubmit:function(v){
      v.id = uid('emp');
      DB.data.employees.push(v); DB.save(); render();
      toast('登録しました：'+v.name, 'ok');
    }
  });
});

action('empEdit', function(ds){
  var e = byId(DB.data.employees, ds.id); if(!e) return;
  openForm({
    title:'社員の編集：'+e.name, wide:true, fields:employeeFields(), value:e,
    headNote:'記入率 '+ledgerStatus(e).rate+'%',
    onSubmit:function(v){
      /* レコードごと入れ替えると、等級画面で入れたコースや昇格条件など、
         このフォームにない項目が消えてしまう。あるキーだけを上書きする。 */
      for(var k in v) e[k] = v[k];
      DB.save(); render();
      toast('保存しました', 'ok');
    }
  });
});

action('empDel', function(ds){
  var e = byId(DB.data.employees, ds.id); if(!e) return;
  var reports = directReports(e.id);
  var warn = reports.length ? '\n\n※ この社員を上司としている部下が'+reports.length+'名います（'+
             reports.map(function(x){return x.name;}).join('、')+'）。削除すると直属上司が未確定になります。' : '';
  confirmDialog('社員の削除', '「'+e.name+'」を削除します。1on1記録・評価記録は残りますが、氏名が表示されなくなります。'+warn+'\n\nよろしいですか？',
    function(){
      DB.data.employees = DB.data.employees.filter(function(x){ return x.id !== e.id; });
      DB.data.employees.forEach(function(x){ if(x.manager === e.id) x.manager = ''; });
      DB.save(); render(); toast('削除しました','ok');
    }, '削除する');
});

action('empView', function(ds){
  var e = byId(DB.data.employees, ds.id); if(!e) return;
  openModal({
    title:e.name+'　役割シート', wide:true,
    headNote:(e.dept||'')+(e.grade?' / '+e.grade:''),

});

action('empPrintOne', function(ds){

  h += '<fieldset><legend>数字</legend><dl class="kv">'+
    row('KPI', lines(e.kpis).length?'<ul class="list-plain">'+lines(e.kpis).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+
    row('目標値', nl2br(e.kpiTarget))+

    '</dl></fieldset>';
  h += '<fieldset><legend>権限・承認</legend><dl class="kv">'+
    row('本人判断で決めてよいこと', nl2br(e.authority))+
    row('承認が必要なこと', nl2br(e.approvals))+
    '</dl></fieldset>';
  h += '<fieldset><legend>引継ぎ</legend><dl class="kv">'+
    row('資料・データ保存場所', nl2br(e.handover))+
    row('代替可能性', esc(e.replaceable))+
    row('引き継ぎ', e.ceoOnlyKnows?'<span class="badge warn">中身を知っているのが1人だけ</span>':'—')+

VIEWS.org = {
  title:'組織・権限マップ',
  desc:'誰が誰に報告するかの関係と、1人が直接みる人数（目安4〜6人）を確認します。',
  render:function(){
    var d = DB.data;
    if(!d.employees.length) return card('組織図','<div class="empty"><div class="big">社員が登録されていません</div></div>',{tight:true});

    var maxDr = num(d.settings.maxDirectReports, 6);
    var roots = d.employees.filter(function(e){ return e.isTop || !e.manager; });
    var seen = {};
    function node(e, depth){
      if(seen[e.id] || depth > 8) return '';
      seen[e.id] = 1;
      var kids = sortBy(directReports(e.id), function(x){ return x.name; });
      var over = kids.length > maxDr;
      var st = ledgerStatus(e);
      var h = '<div style="margin-left:'+(depth*22)+'px;border-left:'+(depth?'2px solid var(--border)':'none')+';padding-left:'+(depth?12:0)+'px;">'+
        '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);margin:4px 0;flex-wrap:wrap;">'+
        '<b>'+esc(e.name)+'</b>'+
        '<span class="small muted">'+esc(e.roleTitle||e.jobType||'')+'</span>'+
        (e.grade?badge(e.grade,'accent'):'')+
        (kids.length?'<span class="badge '+(over?'bad':'neutral')+'">部下'+kids.length+'名</span>':'')+
        (st.rate<100?'<span class="badge warn">台帳'+st.rate+'%</span>':'')+
        '<span style="flex:1"></span>'+ btn('詳細','empView',{id:e.id})+
        '</div>';
      if(over)
        h += '<div class="alert warn" style="margin-left:12px;"><span class="ic">'+ic('info',15)+'</span><div class="body"><div class="t">直属部下が'+kids.length+'名（上限'+maxDr+'名）</div>'+
             '<div class="d">一般社員を直接管理しすぎない。中間の管理職に委任してください。</div></div></div>';
      kids.forEach(function(k){ h += node(k, depth+1); });
      return h + '</div>';
    }
    var tree = roots.map(function(r){ return node(r, 0); }).join('');
    var orphans = d.employees.filter(function(e){ return !seen[e.id]; });
    if(orphans.length){
      tree += '<div class="sep"></div><div class="small muted">上司の設定が循環している、または未確定の社員</div>';
      orphans.forEach(function(e){
        tree += '<div style="padding:6px 10px;border:1px solid var(--bad-bd);border-radius:8px;background:var(--bad-bg);margin:4px 0;">'+
          esc(e.name)+' '+badge('直属上司を確認','bad')+' '+btn('編集','empEdit',{id:e.id})+'</div>';
      });
    }

    var h = '';
    h += '<div class="help-block"><b>1人が直接みる人数は、4〜6人が目安です。</b>'+
         'これを超えると、一人ひとりに使える時間が足りなくなり、確認が形だけになりがちです。'+
         '間に立つ役割を置くか、担当を分けることを検討してください。</div>';
    h += card('組織図（直属の上司でつないだもの）', tree, {icon:'sitemap'});

    /* 権限一覧 */
    var rows = sortBy(d.employees.filter(function(e){ return (e.authority||'').trim() || (e.approvals||'').trim(); }),
                      function(e){ return (e.dept||'')+e.name; });
    h += card('権限・承認の一覧', tableHtml([
      {label:'氏名', width:'130px', render:function(e){ return '<b>'+esc(e.name)+'</b><div class="small muted">'+esc(e.dept||'')+'</div>'; }},
      {label:'本人判断で決めてよいこと', render:function(e){ return nl2br(e.authority)||'<span class="badge warn">未記入</span>'; }},
      {label:'承認が必要なこと', render:function(e){ return nl2br(e.approvals)||'<span class="badge warn">未記入</span>'; }}
    ], rows, {emptyTitle:'権限が記入されていません', emptyText:'台帳で「本人判断で決めてよいこと」「承認が必要なこと」を記入してください。'}),
    {tight:true, sub:'決めてよい範囲があいまいだと、細かい判断まで上に戻ってきます'});
    return h;
  }
};

function goalTable(list, showDept){

  cols = cols.concat([
    { label:'目標', render:function(g){
        var cat = GOAL_CATEGORIES.filter(function(c){return c.key===g.category;})[0];
        return '<b>'+esc(g.title)+'</b>'+(cat?' '+badge(cat.label,'accent'):'')+
               (g.note?'<div class="small muted">'+esc(g.note)+'</div>':''); } },
    { label:'指標', width:'110px', render:function(g){ return esc(g.metric)+(g.unit?'<div class="small muted">'+esc(g.unit)+'</div>':''); } },
    { label:'現在値', cls:'num', width:'80px', render:function(g){ return g.baseline===''?'—':esc(g.baseline); } },
    { label:'最新値', cls:'num', width:'80px', render:function(g){ return g.current===''?'—':'<b>'+esc(g.current)+'</b>'; } },
    { label:'90日目標', cls:'num', width:'90px', render:function(g){ return esc(g.target90); } },
    { label:'進捗', width:'130px', render:function(g){
        var p = goalProgress(g);
        if(p === null) return '<span class="muted small">—</span>';
        return progressBar(p, p>=80?'ok':p>=40?'warn':'bad')+'<span class="small mono">'+p+'%</span>'; } },
    { label:'責任者', width:'110px', render:function(g){ return g.owner ? esc(empName(g.owner)) : badge('未設定','bad'); } },
    { label:'正とするデータ', render:function(g){ return g.dataSource ? '<span class="small">'+esc(g.dataSource)+'</span>' : badge('未設定','bad'); } },
    { label:'', cls:'actions', width:'150px', render:function(g){
        return btn('実績更新','goalUpdate',{id:g.id})+' '+btn('編集','goalEdit',{id:g.id})+' '+btn('削除','goalDel',{id:g.id},'danger'); } }

  });

function renderGoalChain(){
  var d = DB.data;
  var comp = d.goals.filter(function(g){ return g.level==='company'; });
  if(!comp.length) return '';
  var h = '<div class="small muted" style="margin-bottom:8px;">会社目標に紐づく部門目標と、その責任者の担当社員のKPIを表示します。</div>';
  comp.forEach(function(g){
    var kids = d.goals.filter(function(x){ return x.level==='dept' && x.parentId===g.id; });
    h += '<div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surface);">'+
      '<div><b>'+esc(g.title)+'</b> <span class="small muted">'+esc(g.metric)+'</span> '+
      (g.owner?badge(empName(g.owner),'accent'):badge('責任者未設定','bad'))+'</div>';
    if(kids.length){
      h += '<div style="margin-top:6px;padding-left:14px;border-left:2px solid var(--border);">';
      kids.forEach(function(k){
        h += '<div class="small">↳ ['+esc(k.dept||'部門未設定')+'] '+esc(k.title)+
             ' <span class="muted">'+esc(k.metric)+'</span> '+(k.owner?esc(empName(k.owner)):'<span class="badge bad">責任者未設定</span>')+'</div>';
      });
      h += '</div>';
    }else{
      h += '<div class="small muted" style="margin-top:4px;padding-left:14px;">↳ 紐づく部門目標がありません。'+
           '<button class="btn sm" data-act="goalNew" data-level="dept" data-parent="'+g.id+'">部門目標を追加</button></div>';
    }
    h += '</div>';
  });
  return card('会社目標 → 部門目標のつながり', h, {});
}

action('goalNew', function(ds){
  var fields = goalFields();
  var val = { level:ds.level||'company', baseline:'', current:'', target90:'' };
  if(ds.parent){
    var p = byId(DB.data.goals, ds.parent);
    if(p){ val.dept = p.dept; val.category = p.category; val.parentId = p.id; }
  }
  openForm({
    title:(val.level==='company'?'会社目標':'部門目標')+'を追加', wide:true, fields:fields, value:val,
    intro:'<b>「正とするデータ」を必ず決めてください。</b> どの数字を正とするかが決まっていないと、週次会議が数字の食い違いで終わります。',
    onSubmit:function(v){
      v.id = uid('goal');
      if(ds.parent) v.parentId = ds.parent;
      if(v.level === 'dept' && !v.parentId){
        var comp = DB.data.goals.filter(function(g){ return g.level==='company'; });
        if(comp.length === 1) v.parentId = comp[0].id;
      }
      DB.data.goals.push(v); DB.save(); render(); toast('目標を追加しました','ok');
    }
  });
});

action('scCreateDefaults', function(){
  confirmDialog('標準8職種の作成',
    '標準のひな形から8職種（事業責任者・営業・マーケティング・顧客対応・開発・経理総務・管理職・経営幹部）の役割表を作成します。\n\n'+
    '既に同じ職種名がある場合は追加しません。作成後、必ず自社の実態に合わせて修正してください。',
    function(){
      var existing = DB.data.scorecards.map(function(s){ return s.jobType; });
      var added = 0;
      DEFAULT_JOB_TYPES.forEach(function(jt){
        if(existing.indexOf(jt) >= 0) return;
        var t = SCORECARD_TEMPLATES[jt];
        if(!t) return;
        var rec = JSON.parse(JSON.stringify(t));
        rec.id = uid('sc'); rec.jobType = jt;
        DB.data.scorecards.push(rec); added++;
      });
      DB.save(); render();
      toast(added+'職種を作成しました。内容を自社に合わせて修正してください。','ok');
    }, '作成する');

/* ---------- 週の作成 ---------- */
action('kpiNewWeek', function(){
  var mon = weekMonday();
  if(DB.data.kpiWeeks.some(function(w){ return w.weekOf === mon; })){
    var ex = DB.data.kpiWeeks.filter(function(w){ return w.weekOf===mon; })[0];
    kpiSel.weekId = ex.id; render();
    toast('今週（'+mon+'）の会議は既に作成されています','');
    return;
  }
  var prev = latestKpiWeek();
  var w = { id:uid('wk'), weekOf:mon, rows:[], attendees:'', ceoDecisions:'', nextCheck:'', minutes:'', createdAt:nowIso() };
  if(prev){
    /* 前週の指標をコピー（実績・原因・対策はクリア） */
    w.rows = prev.rows.map(function(r){
      return { id:uid('row'), indicator:r.indicator, target:r.target, actual:'', lowerIsBetter:r.lowerIsBetter,
               source:r.source, owner:r.owner, cause:'', action:'', due:'', goalId:r.goalId };
    });
    w.attendees = prev.attendees;
  }else{
    w.rows = importGoalRows();
  }
  DB.data.kpiWeeks.push(w); kpiSel.weekId = w.id; DB.save(); render();
  toast(mon+' の週の会議を作成しました（指標'+w.rows.length+'件）','ok');
});

function importGoalRows(){
  var rows = [];
  DB.data.goals.forEach(function(g){
    rows.push({ id:uid('row'), indicator:g.metric+(g.level==='dept'&&g.dept?'（'+g.dept+'）':''),
      target:g.target90, actual:'', lowerIsBetter:!!g.lowerIsBetter, source:g.dataSource,
      owner:g.owner, cause:'', action:'', due:'', goalId:g.id });
  });
  return rows;
}

action('kpiImport', function(ds){
  var w = byId(DB.data.kpiWeeks, ds.w); if(!w) return;
  var d = DB.data;
  var candidates = [];
  d.goals.forEach(function(g){
    candidates.push({ key:'goal_'+g.id, label:'【目標】'+g.metric+(g.dept?'（'+g.dept+'）':''),
      indicator:g.metric+(g.level==='dept'&&g.dept?'（'+g.dept+'）':''), target:g.target90,
      lowerIsBetter:!!g.lowerIsBetter, source:g.dataSource, owner:g.owner, goalId:g.id });
  });
  d.employees.forEach(function(e){
    lines(e.kpis).forEach(function(k, i){
      candidates.push({ key:'emp_'+e.id+'_'+i, label:'【'+e.name+'】'+k,
        indicator:k+'（'+e.name+'）', target:'', lowerIsBetter:false, source:e.dataSource, owner:e.id });
    });
  });
  if(!candidates.length){ toast('取り込める指標がありません。先に目標または社員KPIを登録してください。','bad'); return; }
  var exists = {};
  w.rows.forEach(function(r){ exists[r.indicator] = 1; });

  var body = '<div class="help-block">会社目標・部門目標・社員KPIから、今週の会議で扱う指標を選びます。'+
    '<b>すべてを毎週扱う必要はありません。</b>目標との差が出やすいものを中心に選んでください。</div>'+
    '<div style="max-height:380px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px 12px;">'+
    candidates.map(function(c,i){
      return '<label class="chk"><input type="checkbox" data-i="'+i+'"'+(exists[c.indicator]?' disabled':'')+'>'+
        '<span>'+esc(c.label)+(exists[c.indicator]?' <span class="badge neutral">追加済み</span>':'')+
        (c.target!==''&&c.target!==undefined?' <span class="small muted">目標 '+esc(c.target)+'</span>':'')+'</span></label>';
    }).join('')+'</div>';
  openModal({
    title:'目標・KPIから取り込む', wide:true, body:body,
    foot:'<button class="btn" data-modal-close>キャンセル</button><button class="btn primary" id="impOk">取り込む</button>',
    onMount:function(root){
      root.querySelector('#impOk').addEventListener('click', function(){
        var n = 0;
        root.querySelectorAll('input[type=checkbox]:checked').forEach(function(cb){
          var c = candidates[num(cb.dataset.i)];
          w.rows.push({ id:uid('row'), indicator:c.indicator, target:c.target, actual:'',
            lowerIsBetter:c.lowerIsBetter, source:c.source, owner:c.owner, cause:'', action:'', due:'', goalId:c.goalId });
          n++;
        });
        DB.save(); closeModal(); render(); toast(n+'件を取り込みました','ok');
      });
    }
  });
});

var meetingTimer = null;
action('kpiMeetingMode', function(ds){
  var w = byId(DB.data.kpiWeeks, ds.w); if(!w) return;
  var stepIndex = 0, elapsed = 0, running = false;

  function stepHtml(){
    return MEETING_AGENDA.map(function(a,i){
      return '<div class="step '+(i===stepIndex?'active':(i<stepIndex?'done':''))+'">'+
        '<b>'+a.min+'分　'+esc(a.label)+'</b><span class="small muted">'+esc(a.hint)+'</span></div>';
    }).join('');
  }
  function focusRows(){
    var rows = w.rows.filter(function(r){ var s=kpiRowStatus(r); return s==='ng'||s==='watch'; });
    if(!rows.length) return '<div class="alert ok"><span class="ic">'+ic('check',15)+'</span><div class="body"><div class="t">目標との差がある項目はありません</div>'+
      '<div class="d">会議は短く終えて構いません。活動報告会にしないこと。</div></div></div>';
    return tableHtml([
      {label:'指標', render:function(r){ return '<b>'+esc(r.indicator)+'</b>'; }},
      {label:'目標', cls:'num', render:function(r){ return esc(r.target); }},
      {label:'実績', cls:'num', render:function(r){ return esc(r.actual); }},
      {label:'差', cls:'num', render:function(r){ return kpiGap(r); }},
      {label:'原因', render:function(r){ return r.cause?'<span class="small">'+esc(r.cause)+'</span>':badge('未記入','warn'); }},
      {label:'対策・担当・期限', render:function(r){
        if(!r.action) return badge('未確定','bad');
        return '<span class="small">'+esc(r.action)+'</span><div class="small muted">'+
               esc(r.owner?empName(r.owner):'担当未定')+' / '+esc(r.due||'期限未定')+'</div>'; }},
      {label:'', cls:'actions', render:function(r){ return btn('入力','kpiMeetRowEdit',{w:w.id,r:r.id}); }}
    ], rows, {});
  }
  function bodyHtml(){
    var total = MEETING_AGENDA.reduce(function(s,a){ return s+a.min; },0)*60;
    var remain = total - elapsed;
    var mm = Math.floor(Math.abs(remain)/60), ss = Math.abs(remain)%60;
    var stepEnd = 0;
    for(var i=0;i<=stepIndex;i++) stepEnd += MEETING_AGENDA[i].min*60;
    var stepRemain = stepEnd - elapsed;
    return '<div class="timer-box" style="margin-bottom:14px;">'+
      '<div class="timer '+(remain<0?'over':'')+'">'+(remain<0?'-':'')+('0'+mm).slice(-2)+':'+('0'+ss).slice(-2)+'</div>'+
      '<div><div class="small muted">全体45分の残り時間</div>'+
        '<div class="small">現在：<b>'+esc(MEETING_AGENDA[stepIndex].label)+'</b>（この項目の残り '+
        (stepRemain<0?'超過 ':'')+Math.floor(Math.abs(stepRemain)/60)+'分'+(Math.abs(stepRemain)%60)+'秒）</div></div>'+
      '<span style="flex:1"></span>'+
      '<div class="btn-row">'+
        '<button class="btn primary" id="mtRun">'+(running?'一時停止':'開始')+'</button>'+
        '<button class="btn" id="mtNext">次の項目へ</button>'+
        '<button class="btn" id="mtReset">リセット</button>'+
      '</div></div>'+
      '<div class="agenda" style="margin-bottom:14px;">'+stepHtml()+'</div>'+
      '<div class="small muted" style="margin-bottom:6px;">目標との差がある項目（ここだけを扱う）</div>'+
      focusRows()+
      '<div class="sep"></div>'+
      '<div class="form-grid">'+
        '<div class="field full"><label>経営判断事項</label><textarea id="mtCeo" rows="3">'+esc(w.ceoDecisions||'')+'</textarea></div>'+
        '<div class="field full"><label>次回の確認事項</label><textarea id="mtNextCheck" rows="2">'+esc(w.nextCheck||'')+'</textarea></div>'+
      '</div>';
  }
  openModal({
    title:'会議モード：'+w.weekOf+' の週', wide:true, body:bodyHtml(),
    foot:'<span class="left small muted">45分を過ぎたら、残りは持ち帰らず経営判断事項として記録します。</span>'+
         '<button class="btn" id="mtClose">閉じる</button>'+
         '<button class="btn primary" id="mtSave">記録して終了</button>',
    onMount:function(root){ bind(root); }
  });
  function bind(root){
    var body = root.querySelector('.modal-body');
    root.querySelector('#mtRun').onclick = function(){
      running = !running;
      if(running){
        meetingTimer = setInterval(function(){
          elapsed++;
          var acc = 0, si = 0;
          for(var i=0;i<MEETING_AGENDA.length;i++){ acc += MEETING_AGENDA[i].min*60; if(elapsed < acc){ si = i; break; } si = i; }
          stepIndex = si;
          redraw();
        }, 1000);
      }else{ clearInterval(meetingTimer); meetingTimer = null; }
      redraw();
    };
    root.querySelector('#mtNext').onclick = function(){
      if(stepIndex < MEETING_AGENDA.length-1){
        stepIndex++;
        var acc = 0; for(var i=0;i<stepIndex;i++) acc += MEETING_AGENDA[i].min*60;
        elapsed = Math.max(elapsed, acc);
        redraw();
      }
    };
    root.querySelector('#mtReset').onclick = function(){
      clearInterval(meetingTimer); meetingTimer = null; running = false; elapsed = 0; stepIndex = 0; redraw();
    };
    root.querySelector('#mtClose').onclick = function(){ clearInterval(meetingTimer); meetingTimer=null; closeModal(); };
    root.querySelector('#mtSave').onclick = function(){
      w.ceoDecisions = body.querySelector('#mtCeo').value;
      w.nextCheck = body.querySelector('#mtNextCheck').value;
      w.closedAt = nowIso();
      clearInterval(meetingTimer); meetingTimer = null;
      DB.save(); closeModal(); render(); toast('会議を記録しました','ok');
    };
    function redraw(){
      var ceo = body.querySelector('#mtCeo').value, nc = body.querySelector('#mtNextCheck').value;
      w.ceoDecisions = ceo; w.nextCheck = nc;
      body.innerHTML = bodyHtml();
      bind(root);
    }
    root._redraw = redraw;   /* 行の編集後に会議モードを描き直すため */
  }
});

function prevMonth(m){
  var y = num(m.split('-')[0]), mo = num(m.split('-')[1]);
  mo--; if(mo === 0){ mo = 12; y--; }
  return y+'-'+('0'+mo).slice(-2);
}

    ];

      emptyTitle:'対象者がいません',

    }), {tight:true});

            '<span style="flex:1"></span>'+
            btn('編集','oooEdit',{id:o.id})+' '+btn('印刷','oooPrint',{id:o.id})+' '+btn('削除','oooDel',{id:o.id},'danger')+
          '</div>'+
          '<div class="grid c2" style="margin-top:8px;gap:10px;">'+
            '<div><div class="small muted">目標と実績</div><div class="small">'+(nl2br(o.kpiReview)||'—')+'</div>'+
              '<div class="small muted" style="margin-top:6px;">うまくいったこと</div><div class="small">'+(nl2br(o.wins)||'—')+'</div></div>'+
            '<div><div class="small muted">問題</div><div class="small">'+(nl2br(o.issues)||'—')+'</div>'+
              '<div class="small muted" style="margin-top:6px;">フィードバック</div><div class="small">'+(nl2br(o.feedback)||'—')+'</div></div>'+
          '</div>'+
          (o.support?'<div class="small muted" style="margin-top:6px;">必要な支援</div><div class="small">'+nl2br(o.support)+'</div>':'')+
          renderPromises(o)+
        '</div>';
      });
      h += card(month+' の記録（'+recs.length+'件）', h2, {});

    return h;
  }
};

function renderPromises(o){
  var ps = o.promises || [];
  if(!ps.length) return '';
  return '<div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;">'+
    '<div class="small muted">翌月の約束</div>'+
    ps.map(function(p,i){
      return '<label class="chk"><input type="checkbox" data-change="oooPromise" data-id="'+o.id+'" data-i="'+i+'"'+(p.done?' checked':'')+'>'+
        '<span class="small'+(p.done?' muted':'')+'" style="'+(p.done?'text-decoration:line-through;':'')+'">'+esc(p.text)+
        (p.due?' <span class="tag">'+esc(p.due)+'</span>':'')+'</span></label>';
    }).join('')+'</div>';
}

function openOooForm(rec, empId){
  var month = oooSel.month;
  var e = byId(DB.data.employees, empId || (rec?rec.employeeId:''));
  var val = rec ? JSON.parse(JSON.stringify(rec)) : {
    employeeId: empId||'', managerId: e?e.manager:'', month:month, date:todayStr(),
    kpiReview:'', wins:'', issues:'', feedback:'', support:'', promiseText:[], promiseDue:'', nextDate:''
  };
  if(rec) val.promiseText = (rec.promises||[]).map(function(p){ return p.text; });

  /* 前回の約束を冒頭に表示 */
  var intro = '';
  if(e){
    var prev = sortBy(DB.data.oneOnOnes.filter(function(o){
      return o.employeeId===e.id && (!rec || o.id!==rec.id) && o.month < month; }), function(o){ return o.month; }).slice(-1)[0];
    if(prev && (prev.promises||[]).length){
      intro = '<b>前回（'+esc(prev.month)+'）の約束：</b><ul class="list-plain" style="margin:4px 0 0;">'+
        prev.promises.map(function(p){ return '<li>'+(p.done?'✓ ':'□ ')+esc(p.text)+'</li>'; }).join('')+'</ul>'+
        '<div style="margin-top:4px;">まずこの結果を確認してから、今月の話に入ってください。</div>';
    }else{
      intro = '性格ではなく<b>期限・行動・結果・影響・次回の約束</b>を記録します。30分を目安に。';
    }
  }else{
    intro = '性格ではなく<b>期限・行動・結果・影響・次回の約束</b>を記録します。30分を目安に。';
  }

  openForm({
    title: rec ? '1on1記録の編集' : '1on1を記録', wide:true, intro:intro,
    fields: oooFields(val.employeeId, month), value: val,
    onSubmit:function(v){
      var promises = lines(v.promiseText).map(function(t, i){
        var old = rec && rec.promises && rec.promises[i];
        return { text:t, due:v.promiseDue, done: old && old.text===t ? old.done : false };
      });
      var obj = {
        id: rec ? rec.id : uid('ooo'),
        employeeId:v.employeeId, managerId:v.managerId, month:v.month, date:v.date,
        kpiReview:v.kpiReview, wins:v.wins, issues:v.issues, feedback:v.feedback, support:v.support,
        promises:promises, nextDate:v.nextDate
      };
      if(rec) DB.data.oneOnOnes[DB.data.oneOnOnes.indexOf(rec)] = obj;
      else DB.data.oneOnOnes.push(obj);
      DB.save(); render(); toast('記録しました','ok');
    }
  });
}

var evalSel = { period:null };

function currentPeriod(){ return evalSel.period || DB.data.settings.currentPeriod || quarterOf(todayStr()); }
function periodList(){
  var ps = uniq(DB.data.evaluations.map(function(e){ return e.period; }).concat([currentPeriod(), quarterOf(todayStr())]));
  return sortBy(ps, function(x){ return x; }).reverse();
}

VIEWS.evaluations = {
  title:'四半期評価',
  desc:'Week 5〜7で基準を確定し、Week 8〜12で初回試験評価。第1四半期は報酬に連動させません。',
  render:function(){
    var d = DB.data;
    var period = currentPeriod();
    var evs = d.evaluations.filter(function(e){ return e.period === period; });
    var h = '';

    /* 配点と4段階の定義 */
    h += '<div class="grid c2">';
    h += '<div>'+card('配点',
      '<div class="small muted">一般社員</div>'+

          '<span style="width:180px;">'+esc(i.label)+'</span>'+progressBar(i.weight)+
          '<b class="mono" style="width:44px;text-align:right;">'+i.weight+'%</b></div>'; }).join('')+
      '<div class="sep"></div><div class="small muted">管理職</div>'+
      EVAL_ITEMS_MANAGER.map(function(i){
        return '<div style="display:flex;gap:8px;align-items:center;padding:3px 0;">'+
          '<span style="width:180px;">'+esc(i.label)+'</span>'+progressBar(i.weight)+
          '<b class="mono" style="width:44px;text-align:right;">'+i.weight+'%</b></div>'; }).join(''),
      {})+'</div>';
    h += '<div>'+card('4段階の定義',
      '<div class="rating-scale">'+RATING_DEFS.map(function(r){
        return '<div class="r"><b>'+r.v+'</b><div>'+esc(r.desc)+'</div></div>'; }).join('')+'</div>'+
      '<div class="sep"></div>'+
      '<div class="small muted">手順</div>'+
      '<div class="step-flow" style="margin-top:4px;">'+EVAL_STAGES.map(function(s,i){
        return '<span class="s">'+(i+1)+'. '+esc(s.label)+'</span>'; }).join('<span>→</span>')+'</div>',
      {sub:'点数ではなく「定義」で合わせる'})+'</div>';
    h += '</div>';

    /* 第1四半期の注意 */
    if(!d.settings.payLinked){
      h += '<div class="notice"><b>試験運用中（報酬に連動していません）。</b> '+
        '第1四半期は評価のみを行い、基準と評価者差を修正します。第2四半期以降、制度が安定した場合に賞与の一部への連動を検討してください。'+
        '報酬連動の前に、就業規則・賃金規程との整合を社労士等へ確認します。</div>';
    }else{
      h += '<div class="alert '+(d.settings.laborCheckDone?'warn':'bad')+'"><span class="ic">'+ic('alert',15)+'</span><div class="body">'+
        '<div class="t">報酬連動が有効になっています</div>'+
        '<div class="d">'+(d.settings.laborCheckDone?
          '就業規則等の確認済みとして記録されています。運用は慎重に。':
          '就業規則・賃金規程との整合が未確認です。減給・賞与・降格への連動前に社労士等へ確認してください。')+'</div></div>'+
        '<div class="go">'+btn('設定','go',{view:'settings'})+'</div></div>';
    }

    /* 操作バー */
    var opts = periodList().map(function(p){ return '<option value="'+esc(p)+'"'+(p===period?' selected':'')+'>'+esc(p)+'</option>'; }).join('');
    h += '<div class="card"><div class="card-body" style="padding:12px 16px;"><div class="inline-form">'+
      '<label>評価期間</label><select data-change="evalPeriod">'+opts+'</select>'+
      '<button class="btn primary" data-act="evalCreateAll">この期間の評価シートを一括作成</button>'+
      '<span style="flex:1"></span>'+
      '<button class="btn" data-act="evalCsv">CSVで書き出す</button>'+
      '<button class="btn" data-act="evalDist">評価者差を確認</button>'+
      '</div></div></div>';

    if(!evs.length){
      h += card(period+' の評価','<div class="empty"><div class="big">この期間の評価シートがありません</div>'+
        '<div>「一括作成」で全社員分の評価シートを作ります。管理職（部下がいる人）は自動で管理職用の配点になります。</div>'+
        '<div class="btn-row" style="justify-content:center;margin-top:10px;">'+
        '<button class="btn primary" data-act="evalCreateAll">評価シートを一括作成</button></div></div>',{tight:true});
      return h;
    }

    /* 進捗サマリー */
    var stageCount = {};
    EVAL_STAGES.forEach(function(s){ stageCount[s.key] = 0; });
    evs.forEach(function(e){ stageCount[e.stage||'self']++; });
    h += '<div class="grid c4" style="margin-bottom:18px;">'+
      EVAL_STAGES.slice(0,4).map(function(s){
        return tile(s.label, stageCount[s.key]+'<small>名</small>','',''); }).join('')+
      '</div>';

    /* 評価一覧 */
    var rows = sortBy(evs, function(e){ var emp = byId(d.employees, e.employeeId); return (emp?(emp.dept||'')+emp.name:''); });
    var cols = [
      { label:'社員', width:'150px', render:function(ev){
          var e = byId(d.employees, ev.employeeId);
          return '<b>'+esc(empName(ev.employeeId))+'</b><div class="small muted">'+esc(e?(e.dept||''):'')+
                 (e&&e.grade?' / '+esc(e.grade):'')+'</div>'; } },
      { label:'評価区分', width:'90px', render:function(ev){
          return badge(ev.type==='manager'?'管理職':'一般社員', ev.type==='manager'?'accent':'neutral'); } },
      { label:'自己評価', width:'80px', cls:'num', render:function(ev){
          var s = evalSelfScore(ev); return s===null?'<span class="muted">—</span>':'<span class="mono">'+s.toFixed(2)+'</span>'; } },
      { label:'上司評価', width:'80px', cls:'num', render:function(ev){
          var s = evalScore(ev); return s===null?'<span class="muted">—</span>':'<b class="mono">'+s.toFixed(2)+'</b>'; } },
      { label:'差', width:'60px', cls:'num', render:function(ev){
          var a = evalSelfScore(ev), b = evalScore(ev);
          if(a===null||b===null) return '<span class="muted">—</span>';
          var g = Math.round((b-a)*100)/100;
          return '<span class="'+(Math.abs(g)>=1?'badge warn':'mono')+'">'+(g>0?'+':'')+g.toFixed(2)+'</span>'; } },
      { label:'判定', width:'120px', render:function(ev){
          var g = evalGradeLabel(evalScore(ev)); return badge(g.label, g.cls); } },
      { label:'進行状況', render:function(ev){
          var idx = evalStageIndex(ev);
          return '<div class="step-flow">'+EVAL_STAGES.map(function(s,i){
            return '<span class="s '+(i<idx?'done':i===idx?'cur':'')+'">'+esc(s.label)+'</span>'; }).join('')+'</div>'; } },
      { label:'', cls:'actions', width:'190px', render:function(ev){
          var idx = evalStageIndex(ev);
          var next = idx < EVAL_STAGES.length-1 ? EVAL_STAGES[idx+1] : null;
          return btn('評価シート','evalOpen',{id:ev.id},'primary')+' '+
                 (next?btn(next.label+'へ','evalNext',{id:ev.id}):'')+' '+
                 '<span class="sep-x"></span>'+btn('削除','evalDel',{id:ev.id},'danger'); } }
    ];
    h += card(period+' の評価（'+evs.length+'名）', tableHtml(cols, rows, {}), {tight:true,
      sub:'自己評価 → 直属上司評価 → 管理職間で調整 → 確定 → 本人説明'});

    /* 低評価者と改善計画 */
    var low = evs.filter(function(ev){ var s = evalScore(ev); return s!==null && s < 2.75; });
    if(low.length){
      h += card('評価2以下の社員（'+low.length+'名）',
        '<div class="help-block">評価2は<b>翌月の改善項目を3つ以内</b>にします。評価1、または評価2が継続する場合は'+
        '<b>30〜60日の改善計画</b>を作成してください。</div>'+
        tableHtml([
          {label:'社員', render:function(ev){ return esc(empName(ev.employeeId)); }},

action('evalNext', function(ds){
  var ev = byId(DB.data.evaluations, ds.id); if(!ev) return;
  var idx = evalStageIndex(ev);
  if(idx >= EVAL_STAGES.length-1) return;
  var next = EVAL_STAGES[idx+1];
  /* 進める前の確認 */
  if(next.key === 'manager' && evalSelfScore(ev) === null){
    toast('自己評価が未入力です。評価シートで入力してください。','bad'); return;
  }
  if(next.key === 'calibration' && evalScore(ev) === null){
    toast('上司評価が未入力です。評価シートで入力してください。','bad'); return;
  }
  if(next.key === 'final' && !String(ev.evidence||'').trim()){
    toast('評価の根拠が未記入です。KPI・週次記録・1on1・成果物を根拠として記入してください。','bad'); return;
  }
  if(next.key === 'explained'){
    ev.explainedAt = todayStr();
  }
  ev.stage = next.key; DB.save(); render();
  toast(next.label+'にしました','ok');
});

action('evalOpen', function(ds){
  var ev = byId(DB.data.evaluations, ds.id); if(!ev) return;
  var emp = byId(DB.data.employees, ev.employeeId);
  var items = evalItemsFor(ev.type);

  function scoreInput(name, key, val){
    return '<div class="score-input">'+RATING_DEFS.slice().reverse().map(function(r){
      return '<label title="'+esc(r.desc)+'"><input type="radio" name="'+name+'_'+key+'" value="'+r.v+'"'+
        (num(val)===r.v?' checked':'')+'><span>'+r.v+'</span></label>'; }).join('')+'</div>';
  }
  function section(title, prefix, scores, comments, note){
    return '<fieldset><legend>'+esc(title)+'</legend>'+
      (note?'<div class="small muted" style="margin-bottom:8px;">'+esc(note)+'</div>':'')+
      items.map(function(it){
        return '<div style="margin-bottom:12px;">'+
          '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">'+
            '<b style="min-width:200px;">'+esc(it.label)+'</b>'+
            '<span class="badge accent">'+it.weight+'%</span>'+
            '<div style="flex:1;min-width:180px;max-width:280px;">'+scoreInput(prefix, it.key, (scores||{})[it.key])+'</div>'+
          '</div>'+
          '<div class="small muted" style="margin:3px 0 4px;">'+esc(it.desc)+'</div>'+
          '<textarea name="'+prefix+'c_'+it.key+'" rows="2" placeholder="根拠（数字・事実・具体例）">'+esc((comments||{})[it.key]||'')+'</textarea>'+
        '</div>';
      }).join('')+'</fieldset>';
  }

  /* 参考情報：KPI・1on1・報告 */
  var refs = '';
  if(emp){
    var kpiRows = [];
    DB.data.kpiWeeks.forEach(function(w){
      w.rows.forEach(function(r){ if(r.owner === emp.id) kpiRows.push({w:w.weekOf, r:r}); });
    });
    var oo = DB.data.oneOnOnes.filter(function(o){ return o.employeeId === emp.id; });
    var promiseTotal = 0, promiseDone = 0;
    oo.forEach(function(o){ (o.promises||[]).forEach(function(p){ promiseTotal++; if(p.done) promiseDone++; }); });
    var myReports = DB.data.reports.filter(function(r){ return r.reporterId === emp.id; });
    var lateReports = myReports.filter(function(r){ return reportDeadlineStatus(r).cls === 'bad'; });
    refs = '<fieldset><legend>評価のもとになる記録（記憶ではなく、この記録を見ます）</legend>'+
      '<div class="grid c4" style="gap:10px;">'+
        tile('担当KPIの行数', kpiRows.length+'', '週次KPI会議での担当','')+
        tile('1on1実施', oo.length+'<small>回</small>','','')+
        tile('約束の達成', promiseTotal?Math.round(promiseDone/promiseTotal*100)+'<small>%</small>':'—', promiseDone+'/'+promiseTotal,'')+
        tile('報告の遅延', lateReports.length+'<small>件</small>', '報告'+myReports.length+'件中', lateReports.length?'bad':'ok')+
      '</div>'+
      (kpiRows.length ? '<div class="sep"></div>'+tableHtml([
        {label:'週', render:function(x){ return esc(x.w); }},
        {label:'指標', render:function(x){ return esc(x.r.indicator); }},
        {label:'目標', cls:'num', render:function(x){ return esc(x.r.target); }},
        {label:'実績', cls:'num', render:function(x){ return esc(x.r.actual); }},
        {label:'状態', render:function(x){ var k=KPI_STATUS.filter(function(y){return y.key===kpiRowStatus(x.r);})[0]; return badge(k.label,k.cls); }}
      ], kpiRows.slice(-10), {}) : '')+
      '</fieldset>';
  }

  var idx = evalStageIndex(ev);
  /* 自己評価を書いている間は、上司の評価も調整メモも見えないようにする。
     先に見えてしまうと、自己評価がそれに引きずられ、両者を突き合わせる意味がなくなる。 */
  var stage = ev.stage || 'self';
  var showMgr   = stage !== 'self';
  var showCalib = (stage === 'calib' || stage === 'final' || stage === 'explained');
  var showFinal = (stage === 'final' || stage === 'explained');

  var stageNote = '';
  if(!showMgr){
    stageNote = '<div class="notice"><b>いまは自己評価の段階です。</b>'+
      '上司の評価は、上司が入力して次の段階に進んだあとで表示されます。'+
      '自分の記録（KPI・1on1・成果物）を見ながら、4段階の定義に照らして点数を付けてください。</div>';
  }else if(!showFinal){
    stageNote = '<div class="notice"><b>本人への説明内容は、確定後に表示されます。</b>'+
      '調整の途中の記録は、決まってから伝えます。</div>';
  }

  var body =
    '<div class="step-flow" style="margin-bottom:14px;">'+EVAL_STAGES.map(function(s,i){
      return '<span class="s '+(i<idx?'done':i===idx?'cur':'')+'">'+esc(s.label)+'</span>'; }).join('')+'</div>'+
    stageNote+
    '<div class="help-block">配点：'+items.map(function(i){ return esc(i.label)+' '+i.weight+'%'; }).join(' ／ ')+
      '<br>点数は<b>4段階の定義</b>に照らして付けます。印象ではなく、KPI・週次の記録・1on1・成果物を根拠にします。</div>'+
    refs+
    '<form id="evForm">'+
      section('① 自己評価', 'self', ev.selfScores, ev.selfComments, '本人が記入します。')+
      (showMgr ? section('② 直属上司の評価', 'mgr', ev.scores, ev.comments,
                         '評価する人：'+(ev.evaluatorId?empName(ev.evaluatorId):'未設定')) : '')+
      (showMgr ?
      '<fieldset><legend>③ 根拠・調整・確定</legend>'+
        '<div class="field"><label>評価の根拠（必須）</label>'+
          '<textarea name="evidence" rows="3" placeholder="例：受注8件（目標8件）、週次の対策3件すべて期限内に完了、1on1で決めたこと4件中4件が完了">'+esc(ev.evidence||'')+'</textarea>'+
          '<div class="hint">記憶や直近の印象だけで動かさないようにします。KPI・週次の記録・1on1・成果物を根拠にします。</div></div>'+
        (showCalib ?
        '<div class="field"><label>評価者どうしの調整メモ</label>'+
          '<textarea name="calibrationNote" rows="2" placeholder="評価する人による甘さ・辛さの差を、どう調整したか">'+esc(ev.calibrationNote||'')+'</textarea></div>' : '')+
        (showFinal ?
        '<div class="field"><label>本人への説明内容</label>'+
          '<textarea name="finalNote" rows="3" placeholder="良かった点、次に期待すること、来期の重点（3つ以内）">'+esc(ev.finalNote||'')+'</textarea></div>' : '')+
      '</fieldset>' : '')+
    '</form>';

  openModal({
    title:'評価シート：'+empName(ev.employeeId)+'（'+ev.period+'）', wide:true,
    headNote:(ev.type==='manager'?'管理職':'一般社員')+'　'+EVAL_STAGES[idx].label,
    wide:true,
    body:body,
    foot:'<button class="btn left" data-act="evalPrint" data-id="'+ev.id+'">印刷</button>'+
         '<button class="btn" data-modal-close>閉じる</button>'+
         '<button class="btn primary" id="evSave">保存</button>',
    onMount:function(root){
      root.querySelector('#evSave').addEventListener('click', function(){
        var f = root.querySelector('#evForm');
        items.forEach(function(it){
          var s = f.querySelector('input[name="self_'+it.key+'"]:checked');
          var m = f.querySelector('input[name="mgr_'+it.key+'"]:checked');
          ev.selfScores = ev.selfScores||{}; ev.scores = ev.scores||{};
          ev.selfComments = ev.selfComments||{}; ev.comments = ev.comments||{};
          if(s) ev.selfScores[it.key] = num(s.value);
          if(m) ev.scores[it.key] = num(m.value);
          ev.selfComments[it.key] = f.querySelector('[name="selfc_'+it.key+'"]').value;
          ev.comments[it.key] = f.querySelector('[name="mgrc_'+it.key+'"]').value;
        });
        ev.evidence = f.querySelector('[name="evidence"]').value;
        ev.calibrationNote = f.querySelector('[name="calibrationNote"]').value;
        ev.finalNote = f.querySelector('[name="finalNote"]').value;
        DB.save(); closeModal(); render(); toast('保存しました','ok');
      });
    }
  });
});

/* 評価者差の確認（第12章：評価者差を修正する） */
action('evalDist', function(){
  var period = currentPeriod();
  var evs = DB.data.evaluations.filter(function(e){ return e.period===period && evalScore(e)!==null; });
  if(!evs.length){ toast('この期間に採点済みの評価がありません','bad'); return; }
  var byEvaluator = {};
  evs.forEach(function(ev){
    var k = ev.evaluatorId || '（評価者未設定）';
    byEvaluator[k] = byEvaluator[k] || [];
    byEvaluator[k].push(evalScore(ev));
  });
  var rows = Object.keys(byEvaluator).map(function(k){
    var arr = byEvaluator[k];
    var avg = arr.reduce(function(a,b){return a+b;},0)/arr.length;
    return { name: k==='（評価者未設定）'?k:empName(k), n:arr.length, avg:Math.round(avg*100)/100,
             min:Math.min.apply(null,arr), max:Math.max.apply(null,arr) };
  });
  var all = evs.map(function(e){ return evalScore(e); });
  var allAvg = all.reduce(function(a,b){return a+b;},0)/all.length;
  var dist = [0,0,0,0];
  all.forEach(function(s){
    if(s>=3.5) dist[3]++; else if(s>=2.75) dist[2]++; else if(s>=1.75) dist[1]++; else dist[0]++;
  });
  openModal({
    title:'評価者差の確認（'+period+'）', wide:true,
    body:'<div class="help-block">評価者ごとの平均点に大きな差がある場合、基準の理解がずれています。'+
      '管理職間の調整（キャリブレーション）で、<b>点数ではなく4段階の定義</b>を突き合わせてください。</div>'+
      '<div class="grid c4" style="margin-bottom:14px;">'+
        tile('全体平均', allAvg.toFixed(2), '対象'+all.length+'名','accent')+
        tile('4（上回る）', dist[3]+'名','','ok')+
        tile('3（期待どおり）', dist[2]+'名','','')+
        tile('2以下', (dist[1]+dist[0])+'名','',(dist[1]+dist[0])?'warn':'')+
      '</div>'+
      tableHtml([
        {label:'評価者', render:function(r){ return esc(r.name); }},
        {label:'人数', cls:'num', render:function(r){ return r.n; }},
        {label:'平均', cls:'num', render:function(r){
          var diff = r.avg - allAvg;
          return '<b>'+r.avg.toFixed(2)+'</b>'+(Math.abs(diff)>=0.5?' '+badge((diff>0?'+':'')+diff.toFixed(2)+' 差','warn'):''); }},
        {label:'最低', cls:'num', render:function(r){ return r.min.toFixed(2); }},
        {label:'最高', cls:'num', render:function(r){ return r.max.toFixed(2); }}
      ], rows, {}),
    foot:'<button class="btn" data-modal-close>閉じる</button>'
  });
});

action('evalCsv', function(){
  var period = currentPeriod();
  var evs = DB.data.evaluations.filter(function(e){ return e.period===period; });
  var maxItems = EVAL_ITEMS_MANAGER.length;
  var head = ['期間','社員','部署','等級','評価区分','評価者'];
  for(var i=1;i<=maxItems;i++) head.push('項目'+i,'配点'+i,'自己'+i,'上司'+i,'根拠'+i);
  head = head.concat(['自己評価','上司評価','判定','評価の根拠','調整メモ','本人説明','進行状況']);
  var rows = [head];
  evs.forEach(function(ev){
    var emp = byId(DB.data.employees, ev.employeeId);
    var items = evalItemsFor(ev.type);
    var r = [ev.period, empName(ev.employeeId), emp?emp.dept:'', emp?emp.grade:'',
             ev.type==='manager'?'管理職':'一般社員', ev.evaluatorId?empName(ev.evaluatorId):''];
    for(var i=0;i<maxItems;i++){
      var it = items[i];
      if(it) r.push(it.label, it.weight+'%', (ev.selfScores||{})[it.key]||'', (ev.scores||{})[it.key]||'', (ev.comments||{})[it.key]||'');
      else r.push('','','','','');
    }
    var s = evalScore(ev), sf = evalSelfScore(ev);
    r.push(sf!==null?sf.toFixed(2):'', s!==null?s.toFixed(2):'', evalGradeLabel(s).label,
           ev.evidence, ev.calibrationNote, ev.finalNote, EVAL_STAGES[evalStageIndex(ev)].label);
    rows.push(r);
  });
  downloadCsv('四半期評価_'+period+'.csv', rows);
  toast('CSVを書き出しました','ok');
});

          return '<b>'+esc(e.name)+'</b><div class="small muted">'+esc(e.dept||'')+'</div>'; } },
      { label:'職種', width:'120px', render:function(e){ return esc(e.jobType||'—'); } },
      { label:'現等級', width:'150px', render:function(e){
          var opts = ['<option value="">未設定</option>'].concat(d.grades.map(function(g){
            return '<option value="'+esc(g.code)+'"'+(e.grade===g.code?' selected':'')+'>'+esc(g.code)+' '+esc(g.expect)+'</option>'; })).join('');
          return '<select data-change="gradeSet" data-id="'+e.id+'" style="padding:3px 6px;">'+opts+'</select>'; } },
      { label:'直近の評価', width:'120px', render:function(e){
          var evs = sortBy(DB.data.evaluations.filter(function(x){ return x.employeeId===e.id && evalScore(x)!==null; }),
                           function(x){ return x.period; });
          if(!evs.length) return '<span class="muted small">—</span>';
          return evs.slice(-2).map(function(x){
            var s = evalScore(x); var g = evalGradeLabel(s);
            return '<div class="small">'+esc(x.period)+' '+badge(s.toFixed(2), g.cls)+'</div>'; }).join(''); } },
      { label:'昇格判定', render:function(e){ return promotionSummary(e); } },
      { label:'', cls:'actions', width:'130px', render:function(e){ return btn('昇格を検討','gradePromote',{id:e.id}); } }
    ], rows, {emptyTitle:'社員が登録されていません'}), {tight:true});

    /* 昇格記録 */
    var hist = [];
    d.employees.forEach(function(e){ (e.gradeHistory||[]).forEach(function(x){ hist.push({e:e, x:x}); }); });
    if(hist.length){
      hist = sortBy(hist, function(o){ return o.x.date; }).reverse();
      h += card('昇格・等級変更の記録', tableHtml([
        {label:'日付', width:'110px', render:function(o){ return esc(o.x.date); }},
        {label:'社員', width:'130px', render:function(o){ return esc(o.e.name); }},
        {label:'変更', width:'140px', render:function(o){ return esc(o.x.from||'—')+' → '+esc(o.x.to); }},
        {label:'条件', render:function(o){
          return (o.x.conditions||[]).map(function(c){ return '✓ '+esc(c); }).join('<br>'); }},
        {label:'理由・決定者', render:function(o){ return esc(o.x.reason||'')+'<div class="small muted">'+esc(o.x.decidedBy||'')+'</div>'; }}
      ], hist, {}), {tight:true});
    }
    return h;
  }
};

function promotionSummary(e){
  var evs = sortBy(DB.data.evaluations.filter(function(x){ return x.employeeId===e.id && evalScore(x)!==null; }),
                   function(x){ return x.period; });
  var sustained = evs.length >= 2 && evalScore(evs[evs.length-1]) >= 2.75 && evalScore(evs[evs.length-2]) >= 2.75;
  var marks = [];
  marks.push((e.doingUpperWork ? '✓' : '□')+' 上位等級の仕事を既に行っている');
  marks.push((sustained ? '✓' : '□')+' 継続的な成果（2期連続で評価3以上）');
  marks.push((e.roleNeeded ? '✓' : '□')+' 会社にその役割が必要');
  var okCount = (e.doingUpperWork?1:0) + (sustained?1:0) + (e.roleNeeded?1:0);
  var cls = okCount===3 ? 'ok' : okCount>=2 ? 'warn' : 'neutral';
  return badge(okCount+'/3 条件', cls)+'<div class="small muted" style="margin-top:2px;">'+marks.join('<br>')+'</div>';
}

action('gradePromote', function(ds){
  var e = byId(DB.data.employees, ds.id); if(!e) return;
  var d = DB.data;
  var idx = d.grades.map(function(g){ return g.code; }).indexOf(e.grade);
  var next = idx >= 0 && idx < d.grades.length-1 ? d.grades[idx+1] : (idx<0 ? d.grades[0] : null);
  var evs = sortBy(d.evaluations.filter(function(x){ return x.employeeId===e.id && evalScore(x)!==null; }),
                   function(x){ return x.period; });
  var sustained = evs.length >= 2 && evalScore(evs[evs.length-1]) >= 2.75 && evalScore(evs[evs.length-2]) >= 2.75;

  openForm({
    title:'昇格の検討：'+e.name, wide:true,
    intro:'<b>昇格は「これから頑張る人」ではなく「既に上位等級の仕事をしている人」に対して行います。</b><br>'+
      '現等級：'+esc(e.grade||'未設定')+(next?' → 検討中：'+esc(next.code)+'（'+esc(next.expect)+'）':'（最上位）'),
    fields:[
      { key:'doingUpperWork', label:'上位等級の仕事を既に行っている', type:'checkbox', full:true,
        hint:'具体例を下の理由欄に書いてください。' },
      { key:'sustainedInfo', type:'static', label:'継続的な成果（自動判定）', full:true,
        raw:true, },
      { key:'roleNeeded', label:'会社にその役割が必要である', type:'checkbox', full:true,
        hint:'ポジションが存在しない昇格は行わない。' },
      { key:'newGrade', label:'新しい等級', type:'select',
        options:[{value:'',label:'（変更しない）'}].concat(d.grades.map(function(g){ return {value:g.code,label:g.code+' '+g.expect}; })) },
      { key:'course', label:'コース（G4以降）', type:'select',
        options:[{value:'',label:'（未設定）'},{value:'manager',label:'管理職コース'},{value:'expert',label:'専門職コース'}] },
      { key:'reason', label:'理由（具体的な事実）', type:'textarea', rows:3, full:true, required:true,
        hint:'例：G3の案件2件を単独で完遂し、後輩2名のレビューを継続実施。2期連続で評価3.4。' },
      { key:'decidedBy', label:'決定者', full:true },
      { key:'date', label:'適用日', type:'date' }
    ],
    value:{
      doingUpperWork: !!e.doingUpperWork, roleNeeded: !!e.roleNeeded,
      newGrade: next?next.code:'', course: e.course||'',
      sustainedInfo: (sustained?'<span class="badge ok">条件を満たす</span>':'<span class="badge warn">未達</span>')+
        ' <span class="small muted">'+(evs.length?evs.slice(-2).map(function(x){ return x.period+'：'+evalScore(x).toFixed(2); }).join(' / '):'評価記録なし')+'</span>',
      reason:'', decidedBy: d.settings.ceoName||'', date: todayStr()
    },
    submitLabel:'記録する',
    onSubmit:function(v){
      e.doingUpperWork = v.doingUpperWork;
      e.roleNeeded = v.roleNeeded;
      if(v.course) e.course = v.course;
      if(v.newGrade && v.newGrade !== e.grade){
        var conds = [];
        if(v.doingUpperWork) conds.push('上位等級の仕事を既に行っている');
        if(sustained) conds.push('継続的な成果');
        if(v.roleNeeded) conds.push('会社にその役割が必要');
        e.gradeHistory = e.gradeHistory || [];
        e.gradeHistory.push({ date:v.date, from:e.grade||'', to:v.newGrade, reason:v.reason,
                              decidedBy:v.decidedBy, conditions:conds });
        e.grade = v.newGrade;
        toast(e.name+'さんを'+v.newGrade+'に変更しました','ok');
      }else{
        toast('検討内容を記録しました','ok');
      }
      DB.save(); render();
    }
  });
});

var repTab = 'rules';

  title:'報告・承認ルール',
  desc:'よくない情報ほど早く共有する仕組みをつくります。早く分かるほど、打てる手が多く残ります。',
  render:function(){
    var h = '';

      {key:'rules',      label:'ルール'},
      {key:'log',        label:'報告ログ'},
      {key:'approval',   label:'承認申請'},
