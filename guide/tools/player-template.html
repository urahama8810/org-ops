<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>使い方レクチャー｜評価制度・組織管理体制 運用アプリ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230f4c81'/><text y='72' x='50' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'>▶</text></svg>">
<style>
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:#0b1118;color:#e8eef5;
  font-family:"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;}
#app{display:flex;flex-direction:column;height:100%;}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#101a26;border-bottom:1px solid #1e2c3c;flex:0 0 auto;}
header .t{font-size:15px;font-weight:700;}
header .s{font-size:12px;color:#8aa4bd;}
header .sp{flex:1;}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#05090e;padding:12px;position:relative;}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 10px 44px rgba(0,0,0,.7);display:block;}
.bigbtn{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;padding-bottom:52px;}
.bigbtn span{width:74px;height:74px;border-radius:50%;background:rgba(10,20,32,.55);border:2px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;font-size:29px;color:#fff;padding-left:5px;
  opacity:.5;transition:transform .15s, opacity .15s;}
.bigbtn:hover span{transform:scale(1.1);opacity:1;background:rgba(20,40,64,.9);}
.bigbtn.hide{display:none;}
.ctrl{flex:0 0 auto;background:#101a26;border-top:1px solid #1e2c3c;padding:10px 18px 14px;}
.seek{height:8px;background:#1e2c3c;border-radius:6px;cursor:pointer;position:relative;margin-bottom:9px;}
.seek .played{height:100%;background:#4da3ff;border-radius:6px;width:0;}
.seek .marks{position:absolute;inset:0;}
.seek .mk{position:absolute;top:-2px;width:2px;height:12px;background:rgba(255,255,255,.35);}
.seek .knob{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:#fff;margin-left:-8px;box-shadow:0 2px 8px rgba(0,0,0,.6);}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.btn{background:#1b2b3d;border:1px solid #2a4058;color:#dbe8f5;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;font-family:inherit;}
.btn:hover{background:#25405c;}
.btn.play{background:#1668ad;border-color:#1668ad;font-weight:700;min-width:92px;}
.btn.play:hover{background:#1d7cc9;}
.btn.off{opacity:.45;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.time{font-size:13px;color:#9fb8d0;font-variant-numeric:tabular-nums;min-width:104px;}
.now{font-size:13px;color:#cfe0f0;flex:1;min-width:180px;}
.now b{color:#ffd166;}
select{background:#1b2b3d;border:1px solid #2a4058;color:#dbe8f5;border-radius:8px;padding:6px 8px;font-family:inherit;font-size:13px;max-width:220px;}
.toc{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:88vw;background:#0e1721;border-left:1px solid #1e2c3c;
  transform:translateX(100%);transition:transform .22s;z-index:50;display:flex;flex-direction:column;}
.toc.open{transform:none;}
.toc .h{padding:14px 16px;border-bottom:1px solid #1e2c3c;display:flex;align-items:center;gap:10px;}
.toc .h b{font-size:14px;}
.toc .h .x{margin-left:auto;cursor:pointer;color:#8aa4bd;font-size:20px;padding:0 6px;}
.toc .list{overflow:auto;padding:8px 0;}
.toc .it{padding:9px 16px;cursor:pointer;border-left:3px solid transparent;font-size:13px;line-height:1.5;}
.toc .it:hover{background:#152233;}
.toc .it.cur{background:#16283c;border-left-color:#4da3ff;}
.toc .it .lb{color:#7fb6ea;font-size:11px;font-weight:700;letter-spacing:.05em;}
.toc .it .tx{color:#c7d8e8;margin-top:2px;}
.toc .it.chap{background:#0a1420;border-top:1px solid #1e2c3c;}
.toc .it.chap .tx{color:#fff;font-weight:700;font-size:14px;}
.hint{font-size:11.5px;color:#6f8aa5;margin-top:7px;}
.warn{font-size:12px;color:#ffcf6b;margin-top:7px;display:none;}
@media(max-width:860px){ header .s{display:none;} .time{min-width:auto;} .now{display:none;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="t">使い方レクチャー</div>
      <div class="s">評価制度・組織管理体制 運用アプリ</div>
    </div>
    <div class="sp"></div>
    <button class="btn" id="tocBtn">目次</button>
    <button class="btn" id="fsBtn">全画面</button>
  </header>

  <div class="stage" id="stage">
    <img id="shot" alt="">
    <div class="bigbtn" id="bigbtn"><span>▶</span></div>
  </div>

  <div class="ctrl">
    <div class="seek" id="seek">
      <div class="played" id="played"></div>
      <div class="marks" id="marks"></div>
      <div class="knob" id="knob" style="left:0"></div>
    </div>
    <div class="row">
      <button class="btn play" id="playBtn">▶ 再生</button>
      <button class="btn" id="prevBtn">◀ 前へ</button>
      <button class="btn" id="nextBtn">次へ ▶</button>
      <span class="time" id="time">0:00 / 0:00</span>
      <span class="now" id="now"></span>
      <button class="btn" id="naBtn" title="ナレーションの入／切">🔊 ナレーション入</button>
      <select id="voiceSel" title="読み上げの声"><option>読み込み中…</option></select>
      <select id="speed" title="再生速度">
        <option value="0.8">ゆっくり</option>
        <option value="1" selected>標準の速さ</option>
        <option value="1.3">速め</option>
        <option value="1.6">とても速い</option>
      </select>
    </div>
    <div class="hint">スペースキー＝再生／一時停止　←→＝前後のコマ　Fキー＝全画面。ナレーションを最後まで読み終えてから次のコマへ進みます。一時停止して自分のペースで読み進めても構いません。</div>
    <div class="warn" id="warn"></div>
  </div>
</div>

<div class="toc" id="toc">
  <div class="h"><b>目次</b><span class="s" id="tocCount"></span><span class="x" id="tocX">×</span></div>
  <div class="list" id="tocList"></div>
</div>

<script>
var FRAMES = [
/*__FRAMES__*/
];
var IMAGES = [
/*__IMAGES__*/
];

var idx = 0, playing = false, elapsed = 0, timer = null, speed = 1;
var TOTAL = FRAMES.reduce(function(s,f){ return s + f.d; }, 0);

/* ---------- ナレーション（ブラウザの音声合成） ---------- */
var TTS = !!window.speechSynthesis;
var voiceOn = true, voice = null, jaVoices = [], speakSeq = 0, spokenDone = true, errCount = 0;
var sawSpeaking = false, voiceDead = false;   /* 音声が実際に鳴っているかの判定用 */

function setWarn(msg){
  var w = document.getElementById('warn');
  w.textContent = msg || '';
  w.style.display = msg ? 'block' : 'none';
}
function pickVoices(){
  if(!TTS){ noVoice('このブラウザは音声読み上げに対応していません。字幕でご覧ください。'); return; }
  var all = speechSynthesis.getVoices() || [];
  jaVoices = all.filter(function(v){ return /^ja/i.test(v.lang); });
  if(!jaVoices.length) return;              /* まだ読み込み中の可能性があるので警告は出さない */
  /* 自然な音声（Natural / Online）を優先する */
  jaVoices.sort(function(a,b){
    var sa = /natural|online/i.test(a.name) ? 0 : 1;
    var sb = /natural|online/i.test(b.name) ? 0 : 1;
    return sa - sb;
  });
  var sel = document.getElementById('voiceSel');
  sel.disabled = false;
  sel.innerHTML = jaVoices.map(function(v, i){
    var nm = v.name.replace(/^Microsoft\s+/, '').replace(/\s*-\s*Japanese.*$/, '');
    return '<option value="' + i + '">' + nm + (v.localService ? '' : '（自然な声）') + '</option>';
  }).join('');
  voice = jaVoices[0];
  setWarn('');
}
function noVoice(msg){
  voiceOn = false; voice = null;
  var b = document.getElementById('naBtn');
  b.textContent = '🔇 音声なし'; b.disabled = true; b.className = 'btn off';
  document.getElementById('voiceSel').disabled = true;
  document.getElementById('voiceSel').innerHTML = '<option>利用できません</option>';
  setWarn(msg);
}
if(TTS){
  pickVoices();
  speechSynthesis.onvoiceschanged = pickVoices;
  var tries = 0;
  var vt = setInterval(function(){
    tries++;
    if(jaVoices.length || tries > 12){
      clearInterval(vt);
      if(!jaVoices.length) noVoice('このパソコンに日本語の読み上げ音声が見つかりませんでした。字幕でご覧ください。');
    } else pickVoices();
  }, 400);
}else{
  noVoice('このブラウザは音声読み上げに対応していません。字幕でご覧ください。');
}

/* 読み上げの分割。
   ブラウザの音声合成は、1回の発話が長いと途中で打ち切られることがある。
   そのため句読点で区切り、1回あたり40文字程度（およそ6秒）までに収める。 */
function splitSay(t){
  var out = [], buf = '';
  t = String(t || '');
  for(var i=0;i<t.length;i++){
    var c = t.charAt(i);
    buf += c;
    var hard = (c === '。' || c === '！' || c === '？' || c === '\n');
    var soft = (c === '、' || c === '，' || c === '：' || c === '；');
    if(hard || (soft && buf.length >= 20) || buf.length >= 40){
      if(buf.replace(/\s/g,'')) out.push(buf);
      buf = '';
    }
  }
  if(buf.replace(/\s/g,'')) out.push(buf);
  return out;
}
/* 読み上げにかかるおおよその秒数（打ち切り判定の目安に使う） */
function estSec(f){
  var n = (f.n || '').length;
  if(!n) return 0;
  return n / (6.2 * Math.max(0.5, speed)) + 2;
}
function narrating(){ return !!(voiceOn && voice && TTS && !voiceDead); }

var curParts = [], curPart = 0;

function stopSpeak(){
  speakSeq++;
  if(TTS){ try{ speechSynthesis.cancel(); }catch(e){} }
}
/* from を指定すると、その文から読み直す（一時停止からの再開に使う） */
function speakFrame(from){
  spokenDone = false; sawSpeaking = false;
  if(!voiceOn || !voice || !TTS){ spokenDone = true; return; }
  var txt = FRAMES[idx].n || '';
  if(!txt.replace(/\s/g,'')){ spokenDone = true; return; }
  stopSpeak();
  curParts = splitSay(txt);
  curPart = Math.max(0, Math.min(curParts.length - 1, from || 0));
  var seq = speakSeq;
  (function next(){
    if(seq !== speakSeq) return;                 /* コマが変わったら中断 */
    if(curPart >= curParts.length){ spokenDone = true; return; }
    var u = new SpeechSynthesisUtterance(curParts[curPart]);
    u.voice = voice; u.lang = 'ja-JP';
    u.rate = Math.max(0.5, Math.min(2, speed)); u.pitch = 1; u.volume = 1;
    u.onend = function(){ errCount = 0; curPart++; next(); };
    u.onerror = function(){
      errCount++;
      /* オンライン音声が使えない環境では、この端末内の音声に切り替える */
      if(errCount === 2){
        var local = jaVoices.filter(function(v){ return v.localService; })[0];
        if(local && local !== voice){
          voice = local;
          var sel = document.getElementById('voiceSel');
          sel.value = String(jaVoices.indexOf(local));
          setWarn('インターネットに接続していないため、このパソコン内の音声に切り替えました。');
        }else{
          noVoice('音声を再生できませんでした。字幕でご覧ください。');
        }
      }
      curPart++;
      next();
    };
    try{ speechSynthesis.speak(u); }catch(e){ spokenDone = true; }
  })();
}

/* Chrome / Edge は、読み上げが長く続くと勝手に止まることがある。
   再生中だけ、定期的に息を入れて止まらないようにする。 */
setInterval(function(){
  if(!playing || !TTS || !narrating()) return;
  try{
    if(speechSynthesis.speaking && !speechSynthesis.paused){
      speechSynthesis.pause(); speechSynthesis.resume();
    }
  }catch(e){}
}, 8000);

/* ---------- 再生 ---------- */
function startOf(i){ var s = 0; for(var k=0;k<i;k++) s += FRAMES[k].d; return s; }
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  return Math.floor(sec/60) + ':' + ('0'+(sec%60)).slice(-2);
}
function show(i){
  idx = Math.max(0, Math.min(FRAMES.length-1, i));
  document.getElementById('shot').src = IMAGES[idx];
  var f = FRAMES[idx];
  document.getElementById('now').innerHTML = '<b>' + (f.l||'') + '</b>';
  document.title = (f.l||'使い方レクチャー') + '｜使い方レクチャー';
  var items = document.querySelectorAll('#tocList .it');
  for(var k=0;k<items.length;k++) items[k].className = items[k].className.replace(' cur','');
  if(items[idx]){
    items[idx].className += ' cur';
    var box = document.getElementById('tocList');
    box.scrollTop = Math.max(0, items[idx].offsetTop - box.clientHeight/2);
  }
  curPart = 0;
  if(playing) speakFrame(0);
  else { stopSpeak(); spokenDone = true; }
  paint();
}
function paint(){
  var f = FRAMES[idx];
  var cur = Math.min(TOTAL, startOf(idx) + Math.min(elapsed, f.d));
  document.getElementById('played').style.width = (cur/TOTAL*100) + '%';
  document.getElementById('knob').style.left = (cur/TOTAL*100) + '%';
  document.getElementById('time').textContent = fmt(cur) + ' / ' + fmt(TOTAL);
}
function tick(){
  elapsed += 0.1;
  var f = FRAMES[idx], ready;
  if(narrating()){
    var speaking = TTS && (speechSynthesis.speaking || speechSynthesis.pending);
    if(speaking) sawSpeaking = true;
    /* 音声が実際には鳴っていない環境（音声デバイスなし等）は、時間送りに切り替える */
    if(!sawSpeaking && elapsed > 4){
      voiceDead = true;
      setWarn('音声が再生されていないようです。字幕でご覧ください（「ナレーション」ボタンで切り替えできます）。');
    }
    /* ナレーションが終わるまで次のコマへ進まない。
       ただし読み上げが固まった場合に備えて、大きめの上限で打ち切る。 */
    var limit = Math.max(f.d, estSec(f) * 2 + 20);
    ready = (spokenDone && !speaking && elapsed >= Math.min(f.d, 1.5)) || elapsed > limit;
  }else{
    ready = elapsed >= f.d / Math.max(0.5, speed);
  }
  if(ready){
    if(idx >= FRAMES.length-1){ elapsed = f.d; pause(); paint(); return; }
    elapsed = 0; show(idx+1); return;
  }
  paint();
}
function play(){
  var last = (idx >= FRAMES.length-1);
  if(last && spokenDone && elapsed >= FRAMES[idx].d){ idx = 0; elapsed = 0; curPart = 0; }
  playing = true;
  document.getElementById('playBtn').textContent = '❚❚ 一時停止';
  document.getElementById('bigbtn').className = 'bigbtn hide';
  /* 一時停止した文の続きから読み直す */
  speakFrame(curPart);
  clearInterval(timer);
  timer = setInterval(tick, 100);
}
function pause(){
  playing = false;
  document.getElementById('playBtn').textContent = '▶ 再生';
  document.getElementById('bigbtn').className = 'bigbtn';
  stopSpeak();
  clearInterval(timer); timer = null;
}
function toggle(){ playing ? pause() : play(); }
function jump(i){
  elapsed = 0;
  if(TTS) stopSpeak();
  show(i);
}

/* ---------- 目次 ---------- */
(function(){
  var list = document.getElementById('tocList'), h = '';
  FRAMES.forEach(function(f, i){
    var cls = 'it' + (f.k === 'chapter' || f.k === 'title' ? ' chap' : '');
    h += '<div class="' + cls + '" data-i="' + i + '">' +
         '<div class="lb">' + fmt(startOf(i)) + (f.k === 'step' && f.l ? '　' + f.l : '') + '</div>' +
         '<div class="tx">' + (f.k === 'step' ? (f.t || '') : (f.l || '')) + '</div></div>';
  });
  list.innerHTML = h;
  document.getElementById('tocCount').textContent = FRAMES.length + 'コマ / ' + fmt(TOTAL);
  list.addEventListener('click', function(e){
    var t = e.target.closest('.it'); if(!t) return;
    jump(parseInt(t.getAttribute('data-i'), 10));
  });
  var m = document.getElementById('marks'), mh = '';
  FRAMES.forEach(function(f, i){
    if(f.k === 'chapter' || f.k === 'title')
      mh += '<div class="mk" style="left:' + (startOf(i)/TOTAL*100) + '%"></div>';
  });
  m.innerHTML = mh;
})();

/* ---------- 操作 ---------- */
document.getElementById('playBtn').onclick = toggle;
document.getElementById('bigbtn').onclick = toggle;
document.getElementById('prevBtn').onclick = function(){ jump(idx-1); };
document.getElementById('nextBtn').onclick = function(){ jump(idx+1); };
document.getElementById('speed').onchange = function(){
  speed = parseFloat(this.value);
  if(playing && voiceOn && voice) speakFrame(curPart);   /* 読んでいる文から、新しい速度で読み直す */
};
document.getElementById('naBtn').onclick = function(){
  if(!voice) return;
  voiceOn = !voiceOn;
  this.textContent = voiceOn ? '🔊 ナレーション入' : '🔇 ナレーション切';
  this.className = 'btn' + (voiceOn ? '' : ' off');
  if(!voiceOn){ stopSpeak(); spokenDone = true; setWarn(''); }
  else { voiceDead = false; errCount = 0; if(playing) speakFrame(curPart); }
};
document.getElementById('voiceSel').onchange = function(){
  voice = jaVoices[parseInt(this.value, 10)] || voice;
  voiceDead = false; errCount = 0; setWarn('');
  if(playing && voiceOn) speakFrame(curPart);
};
document.getElementById('tocBtn').onclick = function(){
  var t = document.getElementById('toc');
  t.className = t.className.indexOf('open') >= 0 ? 'toc' : 'toc open';
};
document.getElementById('tocX').onclick = function(){ document.getElementById('toc').className = 'toc'; };
document.getElementById('fsBtn').onclick = function(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};
document.getElementById('seek').onclick = function(e){
  var r = this.getBoundingClientRect();
  var target = (e.clientX - r.left) / r.width * TOTAL, acc = 0;
  for(var i=0;i<FRAMES.length;i++){
    if(target < acc + FRAMES[i].d){ jump(i); return; }
    acc += FRAMES[i].d;
  }
  jump(FRAMES.length-1);
};
document.addEventListener('keydown', function(e){
  if(e.key === ' '){ e.preventDefault(); toggle(); }
  else if(e.key === 'ArrowRight'){ jump(idx+1); }
  else if(e.key === 'ArrowLeft'){ jump(idx-1); }
  else if(e.key === 'f' || e.key === 'F'){ document.getElementById('fsBtn').click(); }
  else if(e.key === 'Escape'){ document.getElementById('toc').className = 'toc'; }
});
/* ページを離れるときに読み上げを止める */
window.addEventListener('beforeunload', function(){ if(TTS) speechSynthesis.cancel(); });

show(0);
</script>
</body>
</html>
